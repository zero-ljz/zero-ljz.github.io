<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>起始页 | Start Page</title>
    <link rel="icon" href="data:," />

    <!-- 本地字体 -->
    <style>
        @font-face {
            font-family: 'Inter';
            src: url('./fonts/Inter-latin.woff2') format('woff2');
            font-weight: 300 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'JetBrains Mono';
            src: url('./fonts/JetBrainsMono-latin.woff2') format('woff2');
            font-weight: 300 700;
            font-style: normal;
            font-display: swap;
        }
    </style>

    <!-- 依赖库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"
            onerror="this.onerror=null;this.src='https://unpkg.com/lunar-javascript@1.7.7/lunar.js'"></script>

    <link href="https://gcore.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css" rel="stylesheet" />

    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace']
                    },
                    colors: {
                        brand: {
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14B8A6',
                            600: '#0d9488'
                        },
                        glass: {
                            bg: 'rgba(30, 41, 59, 0.90)', // 更不透明的背景，防止文字重叠干扰
                            border: 'rgba(255, 255, 255, 0.08)',
                            hover: 'rgba(255, 255, 255, 0.08)'
                        }
                    },
                    zIndex: {
                        'menu': '9999',
                    }
                }
            }
        }
    </script>

    <style>
        html {
            background-color: #0f172a;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            text-shadow: 0 .05rem .1rem rgba(0, 0, 0, .5);
            isolation: isolate;
        }

        #water-effect {
            position: fixed;
            inset: 0;
            z-index: -20;
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* APlayer 在白色面板和动态壁纸上都保持清晰可读。 */
        .aplayer.aplayer-fixed .aplayer-title {
            color: #111827;
            font-weight: 700;
            text-shadow: none;
        }

        .aplayer.aplayer-fixed .aplayer-info .aplayer-music .aplayer-author {
            color: #475569;
            font-weight: 500;
            text-shadow: none;
        }

        .aplayer.aplayer-fixed .aplayer-list {
            background: rgba(255, 255, 255, 0.98);
            text-shadow: none;
        }

        .aplayer.aplayer-fixed .aplayer-list ol li {
            border-top-color: #e2e8f0;
        }

        .aplayer.aplayer-fixed .aplayer-list ol li:hover {
            background: #f1f5f9;
        }

        .aplayer.aplayer-fixed .aplayer-list ol li.aplayer-list-light {
            background: #e2e8f0;
        }

        .aplayer.aplayer-fixed .aplayer-list .aplayer-list-index {
            color: #64748b;
        }

        .aplayer.aplayer-fixed .aplayer-list .aplayer-list-title {
            color: #0f172a;
            font-weight: 600;
        }

        .aplayer.aplayer-fixed .aplayer-list .aplayer-list-author {
            color: #475569;
            font-weight: 500;
        }

        .aplayer.aplayer-fixed .aplayer-list .aplayer-list-light .aplayer-list-title {
            color: #020617;
            font-weight: 700;
        }

        .aplayer.aplayer-fixed .aplayer-lrc p {
            color: rgba(255, 255, 255, 0.82);
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 8px rgba(0, 0, 0, 0.8);
        }

        .aplayer.aplayer-fixed .aplayer-lrc .aplayer-lrc-current {
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 1px 3px #000000, 0 0 10px rgba(0, 0, 0, 0.9);
        }

        /* 滚动条美化 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
        
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 亚克力玻璃拟态 */
        .acrylic {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .acrylic-hover { transition: all 0.3s ease; }
        .acrylic-hover:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }


        .dynamic-menu-container {
            position: fixed; /* 使用 fixed 定位，避免滚动父级影响 */
            min-width: 220px;
            max-width: 300px; /* 限制最大宽度 */
            padding: 4px;
            border-radius: 0.75rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            /* 关键：限制最大高度，启用内部滚动 */
            max-height: calc(100vh - 20px); 
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* 菜单出现动画 */
        .animate-fade-in {
            animation: menuFadeIn 0.1s ease-out forwards;
        }

        @keyframes menuFadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .wallpaper-status {
            position: fixed;
            top: calc(64px + env(safe-area-inset-top, 0px));
            right: max(20px, env(safe-area-inset-right, 0px));
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 9px;
            width: max-content;
            min-width: 210px;
            max-width: min(320px, calc(100vw - 32px));
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 0.75rem;
            opacity: 0;
            transform: translateY(-6px) scale(0.98);
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
        }

        .wallpaper-status.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .wallpaper-status__icon {
            display: grid;
            place-items: center;
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            color: #14B8A6;
        }

        .wallpaper-status__icon svg {
            width: 16px;
            height: 16px;
        }

        .wallpaper-status__message {
            min-width: 0;
            overflow: hidden;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            text-overflow: ellipsis;
            text-shadow: 0 .05rem .1rem rgba(0, 0, 0, .5);
            white-space: nowrap;
        }

        .wallpaper-status.is-loading .wallpaper-status__icon svg {
            animation: wallpaperStatusSpin 0.9s linear infinite;
        }

        .wallpaper-status.is-success .wallpaper-status__icon { color: #34d399; }

        .wallpaper-status.is-error .wallpaper-status__icon { color: #fb7185; }

        @keyframes wallpaperStatusSpin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1023px) {
            .wallpaper-status {
                top: calc(68px + env(safe-area-inset-top, 0px));
                right: max(16px, env(safe-area-inset-right, 0px));
            }
        }

        @media (max-width: 640px) {
            .wallpaper-status {
                right: max(16px, env(safe-area-inset-right, 0px));
                left: max(16px, env(safe-area-inset-left, 0px));
                width: auto;
                min-width: 0;
                max-width: none;
            }
        }

        @media (max-width: 360px) {
            .wallpaper-status {
                right: max(10px, env(safe-area-inset-right, 0px));
                left: max(10px, env(safe-area-inset-left, 0px));
                gap: 8px;
                padding: 9px 10px;
            }

            .wallpaper-status__message {
                overflow: visible;
                font-size: 12px;
                overflow-wrap: anywhere;
                text-overflow: clip;
                white-space: normal;
            }
        }

        /* 表单控件：允许选中文本，去掉正文的文字阴影 */
        input,
        textarea,
        select,
        [contenteditable="true"] {
            user-select: text;
            -webkit-user-select: text;
            text-shadow: none;
        }

        input::placeholder,
        textarea::placeholder { color: #64748b; }

        ::selection { background: rgba(20, 184, 166, 0.35); }

        /* 起始页：数字时钟等宽数字 */
        .tabular { font-variant-numeric: tabular-nums; }

        /* 网站导航磁贴的首字母占位图标 */
        .tile-letter {
            display: grid;
            place-items: center;
            font-size: 15px;
            font-weight: 700;
            color: #e2e8f0;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.45), rgba(59, 130, 246, 0.45));
        }

        /* 浮层面板（搜索补全 / 弹窗）：会盖在其它卡片上，需要更实的底色保证可读性 */
        .overlay-panel {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 便签输入框 */
        .note-input {
            width: 100%;
            min-height: 74px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: #f1f5f9;
            font: inherit;
            font-size: 13.5px;
            line-height: 1.6;
        }

        @media (prefers-reduced-motion: reduce) {
            .wallpaper-status { transition: none; }
            .wallpaper-status.is-loading .wallpaper-status__icon svg { animation: none; }
            .acrylic-hover { transition: none; }
        }
    </style>
</head>

<body x-data="mainApp" class="overflow-x-hidden min-h-screen lg:pt-12 select-none"
      @contextmenu="openContextMenu($event)"
      @click="closeContextMenu()">

    <canvas id="water-effect" aria-hidden="true"></canvas>

    <!-- 背景装饰 -->
    <div class="fixed inset-0 overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-brand-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[10%] right-[-5%] w-[400px] h-[400px] bg-blue-600/20 rounded-full blur-[100px]"></div>
    </div>

    <!-- ===================== 顶部菜单栏 ===================== -->
<header class="hidden lg:flex fixed top-0 left-0 w-full h-12 acrylic z-50 items-center px-4 justify-between shadow-lg">
        <div class="flex items-center h-full">
            <div class="mr-6 font-bold text-white flex items-center gap-2">
                <i data-lucide="layout-grid" class="w-5 h-5 text-brand-500"></i>
                <span>Start Page</span>
            </div>
            
            <!-- 顶部菜单循环 -->
            <div class="flex h-full items-center gap-1">
                <template x-for="(item, index) in menuData" :key="index">
                    <div class="relative h-8 px-3 rounded-md flex items-center cursor-pointer hover:bg-white/10 transition-colors text-sm text-gray-300 hover:text-white group"
                         @mouseenter="handleTopMenuHover($event, item)"
                         @click="handleMenuClick(item)">
                        <!-- 顶级菜单图标 -->
                        <i x-show="item.icon" :data-lucide="item.icon" class="w-3.5 h-3.5 mr-2 opacity-70"></i>
                        <span x-text="item.label"></span>
                        <i x-show="item.children" data-lucide="chevron-down" class="w-3 h-3 ml-1 opacity-50"></i>
                    </div>
                </template>
            </div>
        </div>

        <!-- 右侧状态区 -->
        <div class="flex items-center gap-3 text-xs text-gray-400">
            <span x-show="bookmarkStatus === 'loading'" class="flex items-center">
                <i data-lucide="loader-2" class="w-3 h-3 animate-spin mr-1"></i> 加载中
            </span>
            <span x-show="bookmarkStatus === 'error'" class="text-red-400 flex items-center">
                <i data-lucide="alert-circle" class="w-3 h-3 mr-1"></i> 无书签文件
            </span>
            <a href="https://github.com/zero-ljz" target="_blank" rel="noopener noreferrer"
               aria-label="访问 GitHub" title="GitHub"
               class="grid w-8 h-8 place-items-center rounded-md text-gray-400 hover:bg-white/10 hover:text-white transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-500">
                <svg aria-hidden="true" viewBox="0 0 24 24" class="w-4 h-4 fill-current">
                    <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.335-1.756-1.335-1.756-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.467-1.332-5.467-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23a11.5 11.5 0 0 1 3.003-.404c1.02.005 2.045.138 3.003.404 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                </svg>
            </a>
            <a href="mailto:hi@iapp.run" aria-label="发送邮件" title="hi@iapp.run"
               class="grid w-8 h-8 place-items-center rounded-md text-gray-400 hover:bg-white/10 hover:text-white transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-500">
                <i data-lucide="mail" class="w-4 h-4"></i>
            </a>
            <a href="https://iapp.run" target="_blank" rel="noopener noreferrer"
               aria-label="访问 iapp.run" title="iapp.run"
               class="block w-8 h-8 rounded-full bg-gradient-to-tr from-brand-500 to-cyan-500 p-[1px] transition-opacity hover:opacity-80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-500">
                <img src="img/avatar.png" alt="zero-ljz" class="rounded-full w-full h-full bg-black object-cover">
            </a>
        </div>
    </header>

    <!-- 移动端菜单按钮：唤起同一套菜单 -->
    <div class="lg:hidden fixed top-4 right-4 z-50">
        <button @click.stop="openMobileMenu($event)" aria-label="打开菜单"
                class="acrylic p-2 rounded-lg text-white hover:bg-white/10 transition">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- ===================== 起始页主体 ===================== -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 pt-20 lg:pt-8 pb-24 space-y-6">

        <!-- 时钟 + 搜索（z-20 让搜索补全面板能盖住下方卡片：卡片的 backdrop-filter 会形成层叠上下文，
             所以必须提升整张卡片的层级，仅提升面板自身无效） -->
        <section class="acrylic rounded-3xl p-6 sm:p-8 relative z-20">
            <!-- 光晕单独裁剪，避免卡片 overflow 影响搜索补全面板 -->
            <div class="absolute inset-0 rounded-3xl overflow-hidden pointer-events-none">
                <div class="absolute -top-24 -right-20 w-72 h-72 bg-brand-600/20 rounded-full blur-3xl"></div>
            </div>
            <div class="relative z-10 space-y-7">
                <div class="flex flex-col sm:flex-row sm:flex-wrap lg:flex-nowrap items-center gap-6 sm:gap-9" x-data="clockWidget">
                    <!-- 模拟表盘 -->
                    <div class="relative w-32 h-32 shrink-0 rounded-full border-4 border-white/10 bg-black/20 backdrop-blur-sm shadow-inner">
                        <template x-for="i in 12" :key="i">
                            <div class="absolute inset-0" :style="`transform: rotate(${i * 30}deg)`">
                                <div class="w-1 h-2 bg-white/30 mx-auto mt-1"></div>
                            </div>
                        </template>
                        <div class="absolute top-1/2 left-1/2 w-1.5 h-8 bg-white rounded-full origin-bottom" :style="`transform: translate(-50%, -100%) rotate(${h}deg)`"></div>
                        <div class="absolute top-1/2 left-1/2 w-1 h-11 bg-gray-300 rounded-full origin-bottom" :style="`transform: translate(-50%, -100%) rotate(${m}deg)`"></div>
                        <div class="absolute top-1/2 left-1/2 w-0.5 h-12 bg-brand-500 rounded-full origin-bottom" :style="`transform: translate(-50%, -100%) rotate(${s}deg)`"></div>
                        <div class="absolute top-1/2 left-1/2 w-3 h-3 bg-brand-500 rounded-full -translate-x-1/2 -translate-y-1/2 shadow-lg border-2 border-white/20"></div>
                    </div>
                    <!-- 数字时间 -->
                    <div class="min-w-0 flex-1 text-center sm:text-left">
                        <p class="flex items-center justify-center sm:justify-start gap-2 text-sm text-gray-400">
                            <i data-lucide="sparkles" class="w-4 h-4 text-brand-500"></i>
                            <span x-text="greeting"></span>
                        </p>
                        <p class="mt-1.5 font-mono font-bold text-white tabular leading-none">
                            <span class="text-5xl sm:text-6xl" x-text="hhmm"></span>
                            <span class="text-2xl sm:text-3xl text-brand-300/90 ml-1" x-text="ss"></span>
                        </p>
                        <p class="mt-3 text-sm text-gray-300" x-text="dateString"></p>
                        <p x-show="widgets.quote && quote" class="mt-2 text-xs text-gray-400 italic max-w-lg" x-text="quote"></p>
                    </div>
                    <!-- 农历新年倒数 -->
                    <div x-show="widgets.newYear && ready" x-data="lunarNewYearCountdown" style="display: none"
                         class="w-full sm:basis-full lg:basis-auto lg:w-auto lg:min-w-[190px] shrink-0 pt-5 lg:pt-0 lg:pl-8 border-t lg:border-t-0 lg:border-l border-white/10 text-center lg:text-left">
                        <p class="flex items-center justify-center lg:justify-start gap-2 text-xs text-gray-400">
                            <i data-lucide="calendar-days" class="w-4 h-4 text-brand-500" aria-hidden="true"></i>
                            <span>距离农历新年</span>
                        </p>
                        <p class="mt-2 font-mono font-bold tabular leading-none text-white">
                            <span class="text-4xl text-brand-300" x-text="days"></span>
                            <span class="ml-1 text-sm font-sans text-gray-300">天</span>
                        </p>
                        <p class="mt-2 text-[11px] text-gray-500" x-text="targetLabel"></p>
                    </div>
                </div>

                <!-- 搜索 -->
                <div x-data="searchWidget" class="relative">
                    <div class="flex flex-wrap items-center gap-2">
                        <template x-for="engine in engines" :key="engine.id">
                            <button type="button" @click="setEngine(engine.id)"
                                    :class="isActive(engine.id) ? 'bg-white/15 border-white/25 text-white' : 'bg-white/5 border-white/10 text-gray-300 hover:bg-white/10'"
                                    class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-medium transition">
                                <img :src="favicon(engine.host)" alt="" class="w-3.5 h-3.5 rounded-sm" onerror="this.style.visibility='hidden'">
                                <span x-text="engine.name"></span>
                            </button>
                        </template>
                    </div>
                    <form @submit.prevent="submit()" class="mt-3 relative" autocomplete="off">
                        <div class="flex items-center gap-3 h-14 px-5 rounded-2xl bg-white/5 border border-white/10 transition focus-within:border-brand-500/60 focus-within:bg-white/10">
                            <i data-lucide="search" class="w-5 h-5 shrink-0 text-brand-300"></i>
                            <input id="sp-search" x-ref="input" type="text" x-model="query"
                                   @input.debounce.200ms="loadSuggestions()"
                                   @keydown="onKeydown($event)"
                                   placeholder="搜索，或输入网址直达…"
                                   class="flex-1 min-w-0 bg-transparent border-0 outline-none text-base text-white">
                            <span x-show="looksLikeUrl" style="display: none"
                                  class="hidden sm:block shrink-0 px-2 py-1 rounded-lg border border-brand-500/30 bg-brand-500/20 text-[11px] text-brand-200">回车直达</span>
                            <button type="button" x-show="query" style="display: none" @click="reset()" aria-label="清空"
                                    class="shrink-0 text-gray-500 hover:text-white transition">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                            <kbd class="hidden sm:block shrink-0 px-1.5 py-0.5 rounded border border-white/10 font-mono text-[10px] text-gray-500">/</kbd>
                        </div>
                        <div x-show="panelOpen && suggestions.length" @click.outside="panelOpen = false" style="display: none"
                             class="absolute left-0 right-0 top-[calc(100%+8px)] z-50 overlay-panel rounded-2xl p-2 max-h-72 overflow-y-auto custom-scrollbar shadow-2xl shadow-black/40">
                            <template x-for="(item, index) in suggestions" :key="item">
                                <button type="button" @click="go(item)" @mouseenter="activeIndex = index"
                                        :class="activeIndex === index ? 'bg-white/10 text-white' : 'text-gray-300'"
                                        class="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-left text-sm transition">
                                    <i data-lucide="search" class="w-3.5 h-3.5 shrink-0 opacity-50"></i>
                                    <span class="truncate" x-text="item"></span>
                                </button>
                            </template>
                        </div>
                    </form>
                </div>
            </div>
        </section>

    <!-- 逻辑脚本 -->
    <script>
        // ===================== 起始页：通用工具 =====================
        const LS_PREFIX = 'startpage.v1.';

        const LS = {
            get(key, fallback) {
                try {
                    const raw = localStorage.getItem(LS_PREFIX + key);
                    return raw === null ? JSON.parse(JSON.stringify(fallback)) : JSON.parse(raw);
                } catch (error) {
                    return JSON.parse(JSON.stringify(fallback));
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
                } catch (error) {
                    console.warn('本地存储不可用:', error);
                }
            },
            keys() {
                try {
                    return Object.keys(localStorage).filter(key => key.startsWith(LS_PREFIX));
                } catch (error) {
                    return [];
                }
            },
            clearAll() {
                this.keys().forEach(key => localStorage.removeItem(key));
            }
        };

        const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
        const pad2 = value => String(value).padStart(2, '0');
        const refreshIcons = () => { try { lucide.createIcons(); } catch (error) { /* lucide 未就绪 */ } };

        const normalizeUrl = value => {
            const raw = (value || '').trim();
            if (!raw) return '';
            if (/^[a-z][a-z0-9+.-]*:/i.test(raw)) return raw;
            return `https://${raw}`;
        };

        const hostOf = url => {
            try { return new URL(normalizeUrl(url)).hostname; } catch (error) { return ''; }
        };

        // 与书签菜单共用同一个 Favicon 服务
        const faviconOf = target => {
            const host = target.includes('.') && !target.includes('/') ? target : hostOf(target);
            return host ? `https://p.252525.xyz/https://www.google.com/s2/favicons?domain=${host}&sz=64` : '';
        };
        // ===================== 起始页：静态配置 =====================
        const SEARCH_ENGINES = [
            { id: 'google', name: 'Google', host: 'www.google.com', url: 'https://www.google.com/search?q=' },
            { id: 'bing', name: 'Bing', host: 'www.bing.com', url: 'https://www.bing.com/search?q=' },
            { id: 'baidu', name: '百度', host: 'www.baidu.com', url: 'https://www.baidu.com/s?wd=' },
            { id: 'sogou', name: '搜狗', host: 'www.sogou.com', url: 'https://www.sogou.com/web?query=' },
            { id: 'ddg', name: 'DuckDuckGo', host: 'duckduckgo.com', url: 'https://duckduckgo.com/?q=' },
            { id: 'github', name: 'GitHub', host: 'github.com', url: 'https://github.com/search?q=' },
            { id: 'zhihu', name: '知乎', host: 'www.zhihu.com', url: 'https://www.zhihu.com/search?type=content&q=' },
            { id: 'bilibili', name: '哔哩哔哩', host: 'www.bilibili.com', url: 'https://search.bilibili.com/all?keyword=' }
        ];

        const DEFAULT_SITE_GROUPS = [
            {
                name: '常用',
                items: [
                    { name: 'Google', url: 'https://www.google.com' },
                    { name: 'Gmail', url: 'https://mail.google.com' },

                tick() {
                    const now = new Date();
                    const seconds = now.getSeconds();
                    const minutes = now.getMinutes();
                    const hours = now.getHours();
                    this.s = seconds * 6;
                    this.m = minutes * 6 + seconds * 0.1;
                    this.h = (hours % 12) * 30 + minutes * 0.5;
                    this.hhmm = `${pad2(hours)}:${pad2(minutes)}`;
                    this.ss = pad2(seconds);

                    this.timer = setInterval(() => this.update(), 60000);

                    clearInterval(this.timer);

                update() {
                    const now = new Date();
                    const dayAfterTarget = this.target
                        ? new Date(this.target.getFullYear(), this.target.getMonth(), this.target.getDate() + 1)
                        : null;
                    if (!this.target || now >= dayAfterTarget) this.target = findNextLunarNewYear(now);
                    if (!this.target) return;

                    this.days = Math.max(0, Math.ceil((this.target.getTime() - now.getTime()) / 86400000));

                        year: 'numeric', month: 'long', day: 'numeric'

                    this.ready = true;

            function findNextLunarNewYear(fromDate) {
                try {
                    if (typeof Solar === 'undefined' || typeof Lunar === 'undefined') return null;
                    const today = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
                    let lunarYear = Solar.fromDate(fromDate).getLunar().getYear();
                    let solar = Lunar.fromYmd(lunarYear, 1, 1).getSolar();
                    let target = new Date(solar.getYear(), solar.getMonth() - 1, solar.getDay());
                    if (target < today) {
                        solar = Lunar.fromYmd(lunarYear + 1, 1, 1).getSolar();
                        target = new Date(solar.getYear(), solar.getMonth() - 1, solar.getDay());
                    }
                    return target;
                } catch (error) {
                    return null;
                }
            }

            function formatLunarDate(date) {
                try {
                    if (typeof Solar !== 'undefined') {
                        const lunar = Solar.fromDate(date).getLunar();
                        const leap = lunar.getMonth() < 0 ? '闰' : '';
                        return `${lunar.getYearInGanZhi()}年${leap}${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
                    }
                    const parts = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', {
                        dateStyle: 'full'
                    }).formatToParts(date);
                    const part = type => parts.find(item => item.type === type)?.value || '';
                    const yearName = part('yearName');
                    const month = part('month');
                    const day = part('day');
                    return yearName && month && day ? `${yearName}年${month}${day}` : '';

                script.charset = 'utf-8';

                    const value = this.query.trim();
                    if (!value || /\s/.test(value)) return false;

                        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);

                        const data = await response.json();
                        const now = data.current;

                        this.current = { temp: Math.round(now.temperature_2m), label: decoded.label, icon: decoded.icon };

                        }));

        // ================= 菜单系统核心逻辑 =================
        class MenuSystem {
            constructor() {
                this.activeMenus = []; 
            }

            /**
             * 显示菜单
             * @param {Array} items 菜单数据
             * @param {number} x 目标X坐标
             * @param {number} y 目标Y坐标
             * @param {HTMLElement} parentEl 父级DOM (用于定位和层级管理)
             */
            show(items, x, y, parentEl = null) {
                // 1. 创建容器
                const menuEl = document.createElement('div');
                // 添加 custom-scrollbar 类以美化内部滚动条
                menuEl.className = `acrylic dynamic-menu-container custom-scrollbar animate-fade-in`;
                menuEl.style.visibility = 'hidden'; // 先隐藏以计算尺寸
                document.body.appendChild(menuEl);

                // 2. 填充数据
                items.forEach(item => {
                    if (item.type === 'separator') {
                        const sep = document.createElement('div');
                        sep.className = 'h-[1px] bg-white/10 my-1 mx-2 shrink-0';
                        menuEl.appendChild(sep);
                        return;
                    }

                    const row = document.createElement('div');
                    row.className = `
                        relative flex items-center justify-between px-3 py-2 rounded-md shrink-0
                        cursor-pointer transition-colors text-sm text-gray-200 hover:text-white hover:bg-white/10
                        ${item.children ? 'group' : ''}
                    `;
                    
                    // === 左侧内容 (图标 + 文本) ===
                    const leftContent = document.createElement('div');
                    leftContent.className = 'flex items-center gap-3 overflow-hidden w-full';
                    
                    // 图标渲染逻辑
                    let iconHtml = '';
                    if (item.iconUrl) {
                        // 优先显示 Favicon 图片
                        iconHtml = `<img src="${item.iconUrl}" class="w-4 h-4 shrink-0 rounded-sm bg-white/10" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                                    <i data-lucide="globe" class="w-4 h-4 opacity-50 shrink-0 hidden"></i>`;
                    } else if (item.icon) {
                        iconHtml = `<i data-lucide="${item.icon}" class="w-4 h-4 opacity-70 shrink-0"></i>`;
                    } else {
                        // 默认文件夹图标
                        const defaultIcon = item.children ? 'folder' : 'file';
                        iconHtml = `<i data-lucide="${defaultIcon}" class="w-4 h-4 opacity-50 shrink-0"></i>`;
                    }
                    
                    leftContent.innerHTML = `${iconHtml}<span class="truncate pr-2">${item.label}</span>`;
                    row.appendChild(leftContent);

                    // === 右侧内容 (箭头、选中状态或快捷键) ===
                    if (item.children) {
                        row.innerHTML += `<i data-lucide="chevron-right" class="w-3 h-3 opacity-50 shrink-0"></i>`;
                    } else if (item.checked !== undefined) {
                        row.innerHTML += item.checked
                            ? `<i data-lucide="check" class="w-4 h-4 ml-2 text-brand-500 shrink-0"></i>`
                            : `<div class="w-4 h-4 ml-2 shrink-0"></div>`;
                    } else if (item.shortcut) {
                        row.innerHTML += `<span class="text-xs text-gray-500 ml-2 shrink-0 font-mono">${item.shortcut}</span>`;
                    }

                    // 事件绑定
                    row.addEventListener('mouseenter', () => this.handleItemHover(row, item, menuEl));
                    row.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (item.children) return; // 有子项时不关闭
                        this.executeAction(item);
                        this.closeAll(); 
                    });

                    menuEl.appendChild(row);
                });

                // 刷新图标
                lucide.createIcons({ root: menuEl });

                // 3. 智能定位计算 (Smart Positioning)
                const rect = menuEl.getBoundingClientRect();
                const winW = window.innerWidth;
                const winH = window.innerHeight;
                const padding = 10; // 屏幕边缘安全距离

                let finalX = x;
                let finalY = y;

                // --- Y轴处理 (防底部溢出 + 防顶部溢出) ---
                if (y + rect.height > winH - padding) {
                    // 如果底部放不下，尝试向上放
                    if (parentEl) {
                        // 子菜单：底部对齐父项底部
                        const parentRect = parentEl.getBoundingClientRect();
                        finalY = parentRect.bottom - rect.height;
                    } else {
                        // 根菜单：直接向上平移
                        finalY = y - rect.height;
                    }
                    
                    // 二次检查：如果向上放导致顶部溢出 (finalY < 0)，则强制吸附顶部并启用滚动
                    if (finalY < padding) {
                        finalY = padding;
                        // 因为我们在 CSS 中设置了 max-height: calc(100vh - 20px) 和 overflow-y: auto
                        // 所以只要 top >= padding，内容就一定能通过滚动看到
                    }
                } else {
                    // 简单的向下微调，如果是子菜单且没溢出，稍微对其
                    if (!parentEl) finalY += 2;
                }

                // --- X轴处理 (防右溢出 + 防左溢出) ---
                // 默认逻辑是向右展开。检查是否超出右边界
                if (x + rect.width > winW - padding) {
                    // 超出右边 -> 向左翻转
                    if (parentEl) {
                        const parentRect = parentEl.getBoundingClientRect();
                        finalX = parentRect.left - rect.width + 4; // +4 为了视觉上的微重叠
                    } else {
                        finalX = x - rect.width;
                    }
                }

                // 二次检查：翻转后是否超出左边界 (finalX < 0) ?
                // 这种情况通常发生在屏幕很窄，或者多级菜单向左套娃时
                if (finalX < padding) {
                    finalX = padding; // 强制靠左显示，覆盖在父菜单上也没办法，总比看不见好
                }

                menuEl.style.left = `${finalX}px`;
                menuEl.style.top = `${finalY}px`;
                menuEl.style.visibility = 'visible';

                this.activeMenus.push(menuEl);
            }

            handleItemHover(rowEl, item, currentMenuEl) {
                // 关闭当前层级之后的所有菜单
                const currentIndex = this.activeMenus.indexOf(currentMenuEl);
                if (currentIndex !== -1) {
                    this.closeFromIndex(currentIndex + 1);
                }

                if (item.children && item.children.length > 0) {
                    const rect = rowEl.getBoundingClientRect();
                    // 默认在右侧展开
                    this.show(item.children, rect.right - 4, rect.top - 4, rowEl);
                }
            }

            executeAction(item) {
                if (item.action) {
                    if (typeof item.action === 'function') {
                        item.action();
                    } else if (typeof item.action === 'string' && item.action.startsWith('http')) {
                        window.open(item.action, '_blank');
                    } else {
                        console.log('Command:', item.action);
                        eval(item.action)
                    }
                }
            }

            closeAll() {
                this.activeMenus.forEach(el => el.remove());
                this.activeMenus = [];
            }

            closeFromIndex(index) {
                while (this.activeMenus.length > index) {
                    const el = this.activeMenus.pop();
                    el.remove();
                }
            }
        }

        const menuSys = new MenuSystem();





    </script>





<script src="./js/water-effect.js"></script>
<script>
    (function() {
        // -------------------------------------------------------
        // 配置区域：在这里填入你喜欢的 API 地址
        // -------------------------------------------------------
        
        // Lorem Picsum 支持跨域读取，可直接作为水面折射纹理。
        const wallpaperApi = 'https://picsum.photos/1920/1080';

        // -------------------------------------------------------
        // 代码逻辑
        // -------------------------------------------------------
        let statusTimer = null;

        function showWallpaperStatus(message, type = 'loading', duration = 2200) {
            let status = document.getElementById('wallpaper-status');
            if (!status) {
                status = document.createElement('div');
                status.id = 'wallpaper-status';
                status.className = 'acrylic wallpaper-status';
                status.setAttribute('role', 'status');
                status.setAttribute('aria-live', 'polite');
                status.setAttribute('aria-atomic', 'true');
                document.body.appendChild(status);
            }

            clearTimeout(statusTimer);
            status.className = `acrylic wallpaper-status is-${type}`;

            const icons = {
                loading: 'loader-circle',
                success: 'check',
                error: 'circle-alert'
            };
            const icon = document.createElement('span');
            icon.className = 'wallpaper-status__icon';
            icon.innerHTML = `<i data-lucide="${icons[type] || 'image'}"></i>`;

            const detail = document.createElement('span');
            detail.className = 'wallpaper-status__message';
            detail.textContent = message;

            status.replaceChildren(icon, detail);
            lucide.createIcons({ root: status });
            requestAnimationFrame(() => status.classList.add('is-visible'));

            if (duration > 0) {
                statusTimer = setTimeout(() => status.classList.remove('is-visible'), duration);
            }
        }

        async function setBackground(showStatus = false) {
            // 获取当前时间戳，用于防止浏览器缓存旧图片
            const timestamp = new Date().getTime();
            
            // 判断 API 链接中是否已经包含了 '?'
            const symbol = wallpaperApi.includes('?') ? '&' : '?';
            
            // 拼接最终 URL (例如: ...api.php?t=123456)
            const finalUrl = `${wallpaperApi}${symbol}t=${timestamp}`;

            if (showStatus) showWallpaperStatus('正在切换随机壁纸...', 'loading', 0);

            try {
                await window.waterEffect.setTexture(finalUrl);
                if (showStatus) showWallpaperStatus('随机壁纸已更新', 'success');
            } catch (error) {
                console.warn('壁纸切换失败:', error);
                if (showStatus) showWallpaperStatus('壁纸切换失败，请稍后重试', 'error', 3200);
            }
        }

        window.switchWallpaper = () => setBackground(true);

        // 提示条同时供起始页各组件复用
        window.showToast = showWallpaperStatus;

        // 页面加载时执行
        window.addEventListener('load', () => setBackground(), { once: true });
    })();
</script>

        const colorThief = new ColorThief();
        const image = new Image();
        const setTheme = async (index) => {
          if (!ap.list.audios[index].theme) {
            const response = await fetch(ap.list.audios[index].cover);
            const blob = await response.blob();
            const coverUrl = URL.createObjectURL(blob);
            image.onload = function () {
              const color = colorThief.getColor(image);
              ap.theme(`rgb(${color[0]}, ${color[1]}, ${color[2]})`, index);
              // console.log(
              //   "theme => " + `rgb(${color[0]}, ${color[1]}, ${color[2]})`
              // );
              URL.revokeObjectURL(coverUrl);
            };
            image.src = coverUrl;
          }
        };

        setTheme(ap.list.index);
        ap.on("listswitch", (index) => {
          setTheme(index.index);
        });
      } catch (error) {
        console.log("Error:", error);
      }
    };

    fetchPlayerList();

  </script>
