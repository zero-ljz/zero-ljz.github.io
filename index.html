        const FALLBACK_QUOTES = [
            '把每一天都当成新的起点。',
            '慢一点，也能抵达。',
            '先做重要的事，其余随缘。'
        ];

        // 复用壁纸提示条作为全局轻提示
        const toast = (message, type = 'loading', duration = 2200) => {
            if (typeof window.showToast === 'function') window.showToast(message, type, duration);
        };

        // ------- 数据导出 / 导入 / 重置 -------
        const exportStartPageData = () => {
            const payload = { app: 'start-page', version: 1, exportedAt: new Date().toISOString(), data: {} };
            LS.keys().forEach(key => { payload.data[key.slice(LS_PREFIX.length)] = localStorage.getItem(key); });
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            const href = URL.createObjectURL(blob);
            link.href = href;
            link.download = `start-page-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(href), 1000);
            toast('数据已导出', 'success');
        };

        const importStartPageData = () => {
            const picker = document.createElement('input');
            picker.type = 'file';
            picker.accept = 'application/json,.json';
            picker.addEventListener('change', async () => {
                const file = picker.files && picker.files[0];
                if (!file) return;
                try {
                    const payload = JSON.parse(await file.text());
                    const data = payload && payload.data;
                    if (!data || typeof data !== 'object') throw new Error('格式不正确');
                    Object.entries(data).forEach(([key, value]) => {
                        localStorage.setItem(LS_PREFIX + key, typeof value === 'string' ? value : JSON.stringify(value));
                    });
                    toast('数据已导入，正在刷新…', 'success');
                    setTimeout(() => location.reload(), 700);
                } catch (error) {
                    console.warn('导入失败:', error);
                    toast('导入失败：文件格式不正确', 'error', 3200);
                }
            });
            picker.click();
        };

        const resetStartPageData = () => {
            if (!window.confirm('恢复默认设置会清空本机保存的导航、便签、待办和偏好，确定继续吗？')) return;
            LS.clearAll();
            location.reload();
        };

        document.addEventListener('alpine:init', () => {
            // 搜索引擎偏好与清单：菜单栏与搜索框共享，列表可在管理弹窗里增删改
            Alpine.store('search', {
                engineId: LS.get('engine', 'google'),
                engines: loadEngines(),
                managerOpen: false,
                managerError: '',
                draft: { id: null, name: '', url: '' },

                setEngine(id) {
                    this.engineId = id;
                    LS.set('engine', id);
                },

                openManager(engine = null) {
                    this.draft = engine ? { id: engine.id, name: engine.name, url: engine.url } : { id: null, name: '', url: '' };
                    this.managerError = '';
                    this.managerOpen = true;
                    Alpine.nextTick(refreshIcons);
                },

                closeManager() {
                    this.managerOpen = false;
                },

                saveEngine() {
                    const name = this.draft.name.trim();
                    const url = this.draft.url.trim();
                    if (!name) { this.managerError = '请填写名称'; return; }
                    const normalized = /^https?:\/\//i.test(url) ? url : `https://${url}`;
                    const host = hostOf(normalized);
                    if (!host) { this.managerError = '搜索链接格式不正确'; return; }
                    if (!normalized.includes('%s') && !normalized.endsWith('=')) {
                        this.managerError = '链接需包含 %s（关键词占位）或以 = 结尾';
                        return;
                    }
                    if (this.draft.id) {
                        const target = this.engines.find(engine => engine.id === this.draft.id);
                        if (target) Object.assign(target, { name, url: normalized, host });
                    } else {
                        this.engines.push({ id: uid(), name, url: normalized, host });
                    }
                    LS.set('engines', this.engines);
                    this.managerOpen = false;
                    Alpine.nextTick(refreshIcons);
                },

                removeEngine(id) {
                    if (this.engines.length <= 1) { this.managerError = '至少保留一个搜索引擎'; return; }
                    this.engines = this.engines.filter(engine => engine.id !== id);
                    if (this.draft.id === id) this.draft = { id: null, name: '', url: '' };
                    if (this.engineId === id) this.setEngine(this.engines[0].id);
                    LS.set('engines', this.engines);
                }
            });
            // 兜底：已选引擎不在列表中（例如刚被删除）时回落到第一个
            {
                const searchStore = Alpine.store('search');
                if (!searchStore.engines.some(engine => engine.id === searchStore.engineId)) {
                    searchStore.setEngine(searchStore.engines[0].id);
                }
            }

            // 命令面板共享数据：书签栏（导航磁贴直接读本地存储）
            Alpine.store('palette', {
                bookmarks: [],
                setBookmarks(tree) {
                    const flat = [];
                    const walk = nodes => (nodes || []).forEach(node => {
                        if (node.children) {
                            walk(node.children);
                        } else if (typeof node.action === 'string' && node.action.startsWith('http')) {
                            flat.push({ name: node.label, url: node.action });
                        }
                    });
                    walk(tree);
                    this.bookmarks = flat;
                }
            });

            // 主应用：菜单栏 + 上下文菜单 + 全局偏好
            Alpine.data('mainApp', () => ({
                widgets: {
                    weather: true, nav: true, notes: true, todo: true, quote: true, newYear: true,
                    calendar: true, pomodoro: true, anniversaries: true, news: true
                },
                quote: '',
                bookmarkStatus: 'loading',
                bookmarkMenu: null,
                helpOpen: false,

                get helpRows() {
                    return [
                        { desc: '聚焦搜索框', keys: ['/', 'Ctrl', 'K'] },
                        { desc: '搜索导航磁贴与书签', keys: ['f', '空格'] },
                        { desc: '进入命令模式（壁纸 / 组件 / 引擎）', keys: ['>'] },
                        { desc: '在候选列表中选择', keys: ['↑', '↓'] },
                        { desc: '打开 / 执行选中项', keys: ['Enter'] },
                        { desc: '关闭弹窗或清空候选', keys: ['Esc'] },
                        { desc: '打开本帮助', keys: ['?'] }
                    ];
                },

                init() {
                    this.widgets = Object.assign({}, this.widgets, LS.get('widgets', {}));
                    this.loadQuote();
                    this.loadBookmarks();
                    window.addEventListener('keydown', event => this.onGlobalKey(event));
                    this.$nextTick(refreshIcons);
                },

                toggleWidget(key) {
                    this.widgets[key] = !this.widgets[key];
                    LS.set('widgets', this.widgets);
                    this.$nextTick(refreshIcons);
                },

                async loadQuote() {
                    this.quote = FALLBACK_QUOTES[Math.floor(Math.random() * FALLBACK_QUOTES.length)];
                    try {
                        const response = await fetch('https://v1.hitokoto.cn/?c=d&c=i&c=k&encode=json');
                        if (!response.ok) return;
                        const data = await response.json();
                        if (data && data.hitokoto) {
                            this.quote = data.from ? `${data.hitokoto} —— ${data.from}` : data.hitokoto;
                        }
                    } catch (error) {
                        // 离线时保留本地句子
                    }
                },

                onGlobalKey(event) {
                    if (event.isComposing || event.keyCode === 229) return;
                    const target = event.target;
                    const typing = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
                    const focusSearch = () => {
                        const input = document.getElementById('sp-search');
                        if (!input) return;
                        event.preventDefault();
                        input.focus();
                        input.select();
                    };

                    if ((event.ctrlKey || event.metaKey) && !event.altKey && event.key.toLowerCase() === 'k') {
                        focusSearch();
                        return;
                    }
                    if (typing) return;
                    if (event.key === '/') focusSearch();
                    else if (event.key === '?') {
                        event.preventDefault();
                        this.helpOpen = true;
                    }
                    else if (event.key === 'Escape') menuSys.closeAll();
                },

                openMobileMenu(event) {
                    menuSys.closeAll();
                    const rect = event.currentTarget.getBoundingClientRect();
                    menuSys.show(this.menuData, rect.right, rect.bottom + 6);
                },

                                { type: 'separator' },
                                {
                                    label: '链接', icon: 'link', children: [
                                        { label: 'GitHub', iconUrl: faviconOf('github.com'), action: 'https://github.com/zero-ljz' },
                                        { label: 'iapp.run', icon: 'globe', action: 'https://iapp.run' },
                                        { label: '发送邮件', icon: 'mail', action: () => { window.location.href = 'mailto:hi@iapp.run'; } }
                                    ]

                                { type: 'separator' },

                                { label: '天气', icon: 'cloud-sun', checked: this.widgets.weather, action: () => this.toggleWidget('weather') },

                                { label: '便签', icon: 'sticky-note', checked: this.widgets.notes, action: () => this.toggleWidget('notes') },
                                { label: '待办', icon: 'list-checks', checked: this.widgets.todo, action: () => this.toggleWidget('todo') },

                                { label: '纪念日', icon: 'heart', checked: this.widgets.anniversaries, action: () => this.toggleWidget('anniversaries') },

                            ]
                        },
                        {
                            label: '搜索引擎', icon: 'search',
                            children: [
                                ...Alpine.store('search').engines.map(engine => ({
                                    label: engine.name,
                                    iconUrl: faviconOf(engine.host),
                                    checked: engineId === engine.id,
                                    action: () => Alpine.store('search').setEngine(engine.id)
                                })),
                                { type: 'separator' },
                                { label: '管理搜索引擎…', icon: 'settings', action: () => Alpine.store('search').openManager() }

                        },
                        { label: '切换壁纸', icon: 'image', action: () => window.switchWallpaper() }

                    // 书签栏也收纳为“起始页”的子菜单（放在“链接”之后、数据操作区之前）
                    if (this.bookmarkMenu) {
                        const home = menu[0];

                        home.children.splice(at, 0, this.bookmarkMenu);

                    return menu;
                },

                async loadBookmarks() {
                    try {
                        const response = await fetch('./data/bookmarks.json');
                        if (!response.ok) throw new Error('File not found');

                days: 0,
                targetLabel: '',
                target: null,
                ready: false,
                timer: null,

                init() {
                    this.update();
                    this.timer = setInterval(() => this.update(), 60000);
                },

                destroy() {
                    clearInterval(this.timer);
                },

                update() {
                    const now = new Date();
                    const dayAfterTarget = this.target
                        ? new Date(this.target.getFullYear(), this.target.getMonth(), this.target.getDate() + 1)
                        : null;
                    if (!this.target || now >= dayAfterTarget) this.target = findNextLunarNewYear(now);
                    if (!this.target) return;

                    this.days = Math.max(0, Math.ceil((this.target.getTime() - now.getTime()) / 86400000));
                    this.targetLabel = this.target.toLocaleDateString('zh-CN', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });
                    this.ready = true;
                }
            }));

            function findNextLunarNewYear(fromDate) {
                try {
                    if (typeof Solar === 'undefined' || typeof Lunar === 'undefined') return null;
                    const today = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
                    let lunarYear = Solar.fromDate(fromDate).getLunar().getYear();
                    let solar = Lunar.fromYmd(lunarYear, 1, 1).getSolar();
                    let target = new Date(solar.getYear(), solar.getMonth() - 1, solar.getDay());
                    if (target < today) {
                        solar = Lunar.fromYmd(lunarYear + 1, 1, 1).getSolar();
                        target = new Date(solar.getYear(), solar.getMonth() - 1, solar.getDay());
                    }
                    return target;
                } catch (error) {
                    return null;
                }
            }

            function formatLunarDate(date) {
                try {
                    if (typeof Solar !== 'undefined') {
                        const lunar = Solar.fromDate(date).getLunar();
                        const leap = lunar.getMonth() < 0 ? '闰' : '';
                        return `${lunar.getYearInGanZhi()}年${leap}${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
                    }
                    const parts = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', {
                        dateStyle: 'full'
                    }).formatToParts(date);
                    const part = type => parts.find(item => item.type === type)?.value || '';
                    const yearName = part('yearName');
                    const month = part('month');
                    const day = part('day');
                    return yearName && month && day ? `${yearName}年${month}${day}` : '';
                } catch (error) {
                    return '';
                }
            }

                script.onerror = () => { cleanup(); reject(new Error('network')); };
                script.charset = 'utf-8';
                script.src = `https://suggestion.baidu.com/su?ie=utf-8&wd=${encodeURIComponent(keyword)}&cb=${callbackName}`;

                get mode() {

                    if (value === '>' || value.startsWith('> ')) return 'commands';
                    return 'search';

                    if (this.mode !== 'search') return false;
                    const value = this.query.trim();
                    if (!value || /\s/.test(value)) return false;

                    return /^[\w-]+(\.[\w-]+)+(:\d+)?([/?#].*)?$/.test(value);

                // f 模式：导航磁贴 + 书签栏
                get fileItems() {

                    const pool = [];
                    const saved = LS.get('sites', null);
                    const groups = Array.isArray(saved) && saved.length ? saved : withIds(DEFAULT_SITE_GROUPS);
                    groups.forEach(group => group.items.forEach(site => pool.push({ name: site.name, url: site.url, source: group.name })));

                    ];
                    const list = [
                        { label: '切换随机壁纸', icon: 'image', action: () => window.switchWallpaper && window.switchWallpaper() },

            Alpine.data('pomodoroWidget', () => ({
                RING: 2 * Math.PI * 54,
                mode: 'focus', // focus | short | long
                running: false,
                endsAt: 0,
                remain: 25 * 60,
                focusOptions: [15, 25, 45, 50],
                focusLen: 25,
                shortLen: 5,
                longLen: 15,
                day: '',
                count: 0,
                focusMin: 0,
                timer: null,
                audio: null,

                init() {
                    const saved = LS.get('pomodoro', {});
                    this.focusLen = saved.focusLen || 25;
                    this.day = todayKey();
                    if (saved.day === this.day) {
                        this.count = saved.count || 0;
                        this.focusMin = saved.focusMin || 0;
                    }
                    if (saved.running && saved.endsAt) {
                        this.mode = saved.mode || 'focus';
                        const left = Math.round((saved.endsAt - Date.now()) / 1000);
                        if (left > 0) {
                            this.endsAt = saved.endsAt;
                            this.remain = left;
                            this.running = true;
                        } else {
                            this.remain = 0;
                            this.finish(true); // 页面关闭期间已经走完
                        }
                    } else {
                        this.mode = saved.mode || 'focus';
                        this.remain = saved.remain > 0 ? saved.remain : this.durationFor(this.mode);
                    }
                    this.timer = setInterval(() => this.tick(), 300);
                },

                destroy() {
                    clearInterval(this.timer);
                },

                durationFor(mode) {
                    return (mode === 'focus' ? this.focusLen : mode === 'short' ? this.shortLen : this.longLen) * 60;
                },

                get total() {
                    return this.durationFor(this.mode);
                },

                get progress() {
                    return this.total ? Math.min(1, 1 - this.remain / this.total) : 0;
                },

                get display() {
                    const safe = Math.max(0, this.remain);
                    return `${pad2(Math.floor(safe / 60))}:${pad2(safe % 60)}`;
                },

                get modeLabel() {
                    return this.mode === 'focus' ? '专注' : this.mode === 'short' ? '短休息' : '长休息';
                },

                persist() {
                    LS.set('pomodoro', {
                        running: this.running,
                        endsAt: this.endsAt,
                        remain: this.remain,
                        mode: this.mode,
                        focusLen: this.focusLen,
                        day: this.day,
                        count: this.count,
                        focusMin: this.focusMin
                    });
                },

                setFocusLen(len) {
                    this.focusLen = len;
                    if (this.mode === 'focus' && !this.running) this.remain = len * 60;
                    this.persist();
                },

                toggle() {
                    this.running ? this.pause() : this.start();
                },

                start() {
                    if (this.running) return;
                    if ('Notification' in window && Notification.permission === 'default') {
                        Notification.requestPermission().catch(() => { /* 拒绝也不影响计时 */ });
                    }
                    this.endsAt = Date.now() + this.remain * 1000;
                    this.running = true;
                    this.persist();
                    this.beep(660, 0.12);
                },

                pause() {
                    if (!this.running) return;
                    this.remain = this.leftNow();
                    this.running = false;
                    this.persist();
                },

                reset() {
                    this.running = false;
                    this.remain = this.total;
                    this.persist();
                },

                skip() {
                    this.finish(false);
                },

                leftNow() {
                    return Math.max(0, Math.round((this.endsAt - Date.now()) / 1000));
                },

                tick() {
                    if (!this.running) return;
                    this.remain = this.leftNow();
                    if (this.remain <= 0) this.finish(false);
                },

                finish(silent) {
                    const wasFocus = this.mode === 'focus';
                    if (wasFocus) {
                        this.count += 1;
                        this.focusMin += this.focusLen;
                    }
                    this.mode = wasFocus ? (this.count % 4 === 0 ? 'long' : 'short') : 'focus';
                    this.running = false;
                    this.remain = this.total;
                    this.persist();
                    if (!silent) {
                        this.announce(wasFocus);
                        this.beep(wasFocus ? 880 : 523, 0.5);
                    } else {
                        toast('番茄钟在页面关闭期间已结束', 'success');
                    }
                },

                announce(wasFocus) {
                    const title = wasFocus ? '专注结束，休息一下' : '休息结束，继续加油';
                    toast(title, 'success');
                    if ('Notification' in window && Notification.permission === 'granted') {
                        try {
                            new Notification('番茄钟', { body: title, silent: true });
                        } catch (error) { /* 通知不可用 */ }
                    }
                },

                beep(frequency, duration) {
                    try {
                        const context = this.audio || (this.audio = new (window.AudioContext || window.webkitAudioContext)());
                        const oscillator = context.createOscillator();
                        const gain = context.createGain();
                        oscillator.connect(gain);
                        gain.connect(context.destination);
                        oscillator.frequency.value = frequency;
                        gain.gain.setValueAtTime(0.001, context.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.18, context.currentTime + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + duration);
                        oscillator.start();
                        oscillator.stop(context.currentTime + duration + 0.05);
                    } catch (error) { /* 音频不可用 */ }
                }
            }));

            Alpine.data('calendarWidget', () => ({

                    const now = new Date();

                    try {

                    } catch (error) {

                    const key = `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
                    const lunar = this.lunarOf(date);
                    let lunarText = '';
                    let highlight = false;
                    let title = key;
                    if (lunar) {
                        const jieqi = lunar.getJieQi();
                        const lunarFestivals = [...lunar.getFestivals(), ...lunar.getOtherFestivals()];
                        let solarFestivals = [];
                        try {
                            if (typeof Solar !== 'undefined') {
                                solarFestivals = Solar.fromYmd(date.getFullYear(), date.getMonth() + 1, date.getDate()).getFestivals();
                            }
                        } catch (error) { /* 公历节日计算失败不影响日历 */ }
                        highlight = !!(jieqi || lunarFestivals.length || solarFestivals.length);
                        lunarText = jieqi || lunarFestivals[0] || solarFestivals[0]
                            || (lunar.getDay() === 1 ? `${lunar.getMonthInChinese()}月` : lunar.getDayInChinese());
                        title = `${key} · ${lunar.getYearInGanZhi()}年${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}` + (jieqi ? ` · ${jieqi}` : '');
                    }
                    return { key, day: date.getDate(), inMonth: date.getMonth() === this.month, lunar: lunarText, highlight, title };
                },

                get weeks() {
                    const first = new Date(this.year, this.month, 1);
                    const offset = (first.getDay() + 6) % 7; // 周一作为一周之首
                    const start = new Date(this.year, this.month, 1 - offset);
                    const cells = [];
                    for (let i = 0; i < 42; i++) {
                        const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
                        cells.push(this.cellOf(date));
                    }
                    return Array.from({ length: 6 }, (_, index) => cells.slice(index * 7, index * 7 + 7));

                        const jieqi = lunar.getJieQi();
                        if (jieqi) tags.push(jieqi);

                    return {

            }));

        // ================= 菜单系统核心逻辑 =================
        class MenuSystem {
            constructor() {
                this.activeMenus = [];
                // 触屏设备点按会先触发 mouseenter 再触发 click：若保持悬停展开，
                // 子菜单会在手指下方弹出并吃掉这次 click（误触第一项）。
                // 因此触屏改为“点击展开再点收起”，桌面端保留悬停展开。
                // URL 加 ?touch-menu 可强制触屏行为，便于测试。
                const forceTouch = new URLSearchParams(location.search).has('touch-menu');
                this.hoverExpand = !forceTouch && !window.matchMedia('(hover: none)').matches;
            }

            /**
             * 显示菜单
             * @param {Array} items 菜单数据
             * @param {number} x 目标X坐标
             * @param {number} y 目标Y坐标
             * @param {HTMLElement} parentEl 父级DOM (用于定位和层级管理)
             */
            show(items, x, y, parentEl = null) {
                // 1. 创建容器
                const menuEl = document.createElement('div');
                // 添加 custom-scrollbar 类以美化内部滚动条
                menuEl.className = `acrylic dynamic-menu-container custom-scrollbar animate-fade-in`;
                menuEl.style.visibility = 'hidden'; // 先隐藏以计算尺寸
                document.body.appendChild(menuEl);

                // 2. 填充数据
                items.forEach(item => {
                    if (item.type === 'separator') {
                        const sep = document.createElement('div');
                        sep.className = 'h-[1px] bg-white/10 my-1 mx-2 shrink-0';
                        menuEl.appendChild(sep);
                        return;
                    }

                    const row = document.createElement('div');
                    row.className = `
                        relative flex items-center justify-between px-3 py-2 rounded-md shrink-0
                        cursor-pointer transition-colors text-sm text-gray-200 hover:text-white hover:bg-white/10
                        ${item.children ? 'group' : ''}
                    `;
                    
                    // === 左侧内容 (图标 + 文本) ===
                    const leftContent = document.createElement('div');
                    leftContent.className = 'flex items-center gap-3 overflow-hidden w-full';
                    
                    // 图标渲染逻辑
                    let iconHtml = '';
                    if (item.iconUrl) {
                        // 优先显示 Favicon 图片
                        iconHtml = `<img src="${item.iconUrl}" class="w-4 h-4 shrink-0 rounded-sm bg-white/10" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                                    <i data-lucide="globe" class="w-4 h-4 opacity-50 shrink-0 hidden"></i>`;
                    } else if (item.icon) {
                        iconHtml = `<i data-lucide="${item.icon}" class="w-4 h-4 opacity-70 shrink-0"></i>`;
                    } else {
                        // 默认文件夹图标
                        const defaultIcon = item.children ? 'folder' : 'file';
                        iconHtml = `<i data-lucide="${defaultIcon}" class="w-4 h-4 opacity-50 shrink-0"></i>`;
                    }
                    
                    leftContent.innerHTML = `${iconHtml}<span class="truncate pr-2">${item.label}</span>`;
                    row.appendChild(leftContent);

                    // === 右侧内容 (箭头、选中状态或快捷键) ===
                    if (item.children) {
                        row.innerHTML += `<i data-lucide="chevron-right" class="w-3 h-3 opacity-50 shrink-0"></i>`;
                    } else if (item.checked !== undefined) {
                        row.innerHTML += item.checked
                            ? `<i data-lucide="check" class="w-4 h-4 ml-2 text-brand-500 shrink-0"></i>`
                            : `<div class="w-4 h-4 ml-2 shrink-0"></div>`;
                    } else if (item.shortcut) {
                        row.innerHTML += `<span class="text-xs text-gray-500 ml-2 shrink-0 font-mono">${item.shortcut}</span>`;
                    }

                    // 事件绑定
                    row.addEventListener('mouseenter', () => {
                        if (this.hoverExpand) this.handleItemHover(row, item, menuEl);
                    });
                    row.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (item.children) {
                            // 触屏：点击展开/收起子菜单；桌面：悬停已展开，点击不动作
                            if (!this.hoverExpand) this.toggleSubMenu(row, item, menuEl);
                            return;
                        }
                        this.executeAction(item);
                        this.closeAll();
                    });

                    menuEl.appendChild(row);
                });

                // 刷新图标
                lucide.createIcons({ root: menuEl });

                // 3. 智能定位计算 (Smart Positioning)
                const rect = menuEl.getBoundingClientRect();
                const winW = window.innerWidth;
                const winH = window.innerHeight;
                const padding = 10; // 屏幕边缘安全距离

                let finalX = x;
                let finalY = y;

                // --- Y轴处理 (防底部溢出 + 防顶部溢出) ---
                if (y + rect.height > winH - padding) {
                    // 如果底部放不下，尝试向上放
                    if (parentEl) {
                        // 子菜单：底部对齐父项底部
                        const parentRect = parentEl.getBoundingClientRect();
                        finalY = parentRect.bottom - rect.height;
                    } else {
                        // 根菜单：直接向上平移
                        finalY = y - rect.height;
                    }
                    
                    // 二次检查：如果向上放导致顶部溢出 (finalY < 0)，则强制吸附顶部并启用滚动
                    if (finalY < padding) {
                        finalY = padding;
                        // 因为我们在 CSS 中设置了 max-height: calc(100vh - 20px) 和 overflow-y: auto
                        // 所以只要 top >= padding，内容就一定能通过滚动看到
                    }
                } else {
                    // 简单的向下微调，如果是子菜单且没溢出，稍微对其
                    if (!parentEl) finalY += 2;
                }

                // --- X轴处理 (防右溢出 + 防左溢出) ---
                // 默认逻辑是向右展开。检查是否超出右边界
                if (x + rect.width > winW - padding) {
                    // 超出右边 -> 向左翻转
                    if (parentEl) {
                        const parentRect = parentEl.getBoundingClientRect();
                        finalX = parentRect.left - rect.width + 4; // +4 为了视觉上的微重叠
                    } else {
                        finalX = x - rect.width;
                    }
                }

                // 二次检查：翻转后是否超出左边界 (finalX < 0) ?
                // 这种情况通常发生在屏幕很窄，或者多级菜单向左套娃时
                if (finalX < padding) {
                    finalX = padding; // 强制靠左显示，覆盖在父菜单上也没办法，总比看不见好
                }

                menuEl.style.left = `${finalX}px`;
                menuEl.style.top = `${finalY}px`;
                menuEl.style.visibility = 'visible';

                this.activeMenus.push(menuEl);
            }

            handleItemHover(rowEl, item, currentMenuEl) {
                // 关闭当前层级之后的所有菜单
                const currentIndex = this.activeMenus.indexOf(currentMenuEl);
                if (currentIndex !== -1) {
                    this.closeFromIndex(currentIndex + 1);
                }

                if (item.children && item.children.length > 0) {
                    const rect = rowEl.getBoundingClientRect();
                    // 默认在右侧展开
                    this.show(item.children, rect.right - 4, rect.top - 4, rowEl);
                }
            }

            // 触屏：点击父级菜单项时切换子菜单（已展开则收起）
            toggleSubMenu(rowEl, item, currentMenuEl) {
                const currentIndex = this.activeMenus.indexOf(currentMenuEl);
                const alreadyOpen = currentIndex !== -1 && this.activeMenus.length > currentIndex + 1;
                if (currentIndex !== -1) {
                    this.closeFromIndex(currentIndex + 1);
                }
                if (alreadyOpen) return;
                this.handleItemHover(rowEl, item, currentMenuEl);
            }

            executeAction(item) {
                if (item.action) {
                    if (typeof item.action === 'function') {
                        item.action();
                    } else if (typeof item.action === 'string' && item.action.startsWith('http')) {
                        window.open(item.action, '_blank');
                    } else {
                        console.log('Command:', item.action);
                        eval(item.action)
                    }
                }
            }

            closeAll() {
                this.activeMenus.forEach(el => el.remove());
                this.activeMenus = [];
            }

            closeFromIndex(index) {
                while (this.activeMenus.length > index) {
                    const el = this.activeMenus.pop();
                    el.remove();
                }
            }
        }

        const menuSys = new MenuSystem();

        // 命令面板（搜索框 > 模式）与主应用的桥接：开关组件 / 打开帮助
        const rootApp = () => Alpine.$data(document.body);
        window.spToggleWidget = key => {
            const app = rootApp();
            if (app && typeof app.toggleWidget === 'function') app.toggleWidget(key);
        };
        window.spOpenHelp = () => {
            const app = rootApp();
            if (app) app.helpOpen = true;
        };





    </script>





<script src="./js/water-effect.js"></script>
<script>
    (function() {
        // -------------------------------------------------------
        // 配置区域：在这里填入你喜欢的 API 地址
        // -------------------------------------------------------
        
        // Lorem Picsum 支持跨域读取，可直接作为水面折射纹理。
        const wallpaperApi = 'https://picsum.photos/1920/1080';

        // -------------------------------------------------------
        // 代码逻辑
        // -------------------------------------------------------
        let statusTimer = null;

        function showWallpaperStatus(message, type = 'loading', duration = 2200) {
            let status = document.getElementById('wallpaper-status');
            if (!status) {
                status = document.createElement('div');
                status.id = 'wallpaper-status';
                status.className = 'acrylic wallpaper-status';
                status.setAttribute('role', 'status');
                status.setAttribute('aria-live', 'polite');
                status.setAttribute('aria-atomic', 'true');
                document.body.appendChild(status);
            }

            clearTimeout(statusTimer);
            status.className = `acrylic wallpaper-status is-${type}`;

            const icons = {
                loading: 'loader-circle',
                success: 'check',
                error: 'circle-alert'
            };
            const icon = document.createElement('span');
            icon.className = 'wallpaper-status__icon';
            icon.innerHTML = `<i data-lucide="${icons[type] || 'image'}"></i>`;

            const detail = document.createElement('span');
            detail.className = 'wallpaper-status__message';
            detail.textContent = message;

            status.replaceChildren(icon, detail);
            lucide.createIcons({ root: status });
            requestAnimationFrame(() => status.classList.add('is-visible'));

            if (duration > 0) {
                statusTimer = setTimeout(() => status.classList.remove('is-visible'), duration);
            }
        }

        async function setBackground(showStatus = false) {
            // 获取当前时间戳，用于防止浏览器缓存旧图片
            const timestamp = new Date().getTime();
            
            // 判断 API 链接中是否已经包含了 '?'
            const symbol = wallpaperApi.includes('?') ? '&' : '?';
            
            // 拼接最终 URL (例如: ...api.php?t=123456)
            const finalUrl = `${wallpaperApi}${symbol}t=${timestamp}`;

            if (showStatus) showWallpaperStatus('正在切换随机壁纸...', 'loading', 0);

            try {
                await window.waterEffect.setTexture(finalUrl);
                if (showStatus) showWallpaperStatus('随机壁纸已更新', 'success');
            } catch (error) {
                console.warn('壁纸切换失败:', error);
                if (showStatus) showWallpaperStatus('壁纸切换失败，请稍后重试', 'error', 3200);
            }
        }

        window.switchWallpaper = () => setBackground(true);

        // 提示条同时供起始页各组件复用
        window.showToast = showWallpaperStatus;

        // 页面加载时执行
        window.addEventListener('load', () => setBackground(), { once: true });
    })();
</script>








<div id="player"></div>

<!-- 第三方增强组件（音乐播放器 / 看板娘）：首屏渲染完成后的空闲时间再加载，不阻塞页面 -->
<script>
    (function () {
        const loadScript = src => new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = resolve;
            script.onerror = () => reject(new Error('load failed: ' + src));
            document.head.appendChild(script);
        });

        const loadCss = href => new Promise((resolve, reject) => {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            link.onload = resolve;
            link.onerror = () => reject(new Error('load failed: ' + href));
            document.head.appendChild(link);
        });

        // ---------- 音乐播放器（APlayer + ColorThief 动态主题色） ----------
        const initPlayer = async () => {
            await loadCss('https://gcore.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css');
            await loadScript('https://gcore.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js');
            try { await loadScript('https://cdn.bootcdn.net/ajax/libs/color-thief/2.4.0/color-thief.min.js'); } catch (e) { /* 主题色提取失败不影响播放 */ }

            try {
                const response = await fetch('https://api.rainss.cn/x-player/api/palyerlist.php?id=725994751');
                const data = await response.json();
                const ap = new APlayer({ // https://aplayer.js.org/#/zh-Hans/?id=入门
                    container: document.getElementById('player'),
                    fixed: true,
                    lrcType: 3,
                    autoplay: false,
                    theme: '#b7daff',
                    audio: data.songs,
                    order: 'random', // 音频循环播放, 可选值: 'all', 'one', 'none'
                    loop: 'all' // 音频循环顺序, 可选值: 'list', 'random'
                });

                if (typeof ColorThief === 'undefined') return;
                const colorThief = new ColorThief();
                const image = new Image();
                const setTheme = async (index) => {
                    if (!ap.list.audios[index].theme) {
                        const response = await fetch(ap.list.audios[index].cover);
                        const blob = await response.blob();
                        const coverUrl = URL.createObjectURL(blob);
                        image.onload = function () {
                            const color = colorThief.getColor(image);
                            ap.theme(`rgb(${color[0]}, ${color[1]}, ${color[2]})`, index);
                            URL.revokeObjectURL(coverUrl);
                        };
                        image.src = coverUrl;
                    }
                };

                setTheme(ap.list.index);
                ap.on('listswitch', (index) => {
                    setTheme(index.index);
                });
            } catch (error) {
                console.log('Error:', error);
            }
        };

        // ---------- Live2D 看板娘 ----------
        const initLive2d = async () => {
            await loadScript('https://cdn.jsdelivr.net/npm/oh-my-live2d@0.19.3/dist/index.min.js');
            OML2D.loadOml2d({
                dockedPosition: 'right',
                mobileDisplay: false,
                primaryColor: '#14B8A6',
                sayHello: false,
                transitionTime: 600,
                models: [
                    {
                        name: 'shizuku',
                        path: 'https://cdn.jsdelivr.net/npm/live2d-widget-model-shizuku@1.0.5/assets/shizuku.model.json',
                        scale: 0.16,
                        position: [0, 20],
                        motionPreloadStrategy: 'IDLE',
                        volume: 0.25,
                        stageStyle: {
                            width: 280,
                            height: 380
                        }
                    }
                ],
                tips: {
                    messageLine: 2,
                    style: {
                        top: '-90px',
                        width: '220px',
                        minHeight: '80px',
                        fontSize: '16px',
                        lineHeight: '1.5',
                        zIndex: 9999
                    },
                    idleTips: {
                        interval: 12000,
                        duration: 4000,
                        message: [
                            '嗨，要和我互动一下吗？',
                            '移动鼠标，我会看向你。',
                            '点点我，会有不同的动作哦。'
                        ]
                    }
                },
                menus: {
                    items(defaultItems) {
                        return defaultItems.filter((item) => item.id === 'Rest');
                    }
                },
                statusBar: {
                    loadingMessage: '看板娘加载中',
                    loadSuccessMessage: '看板娘已上线',
                    loadFailMessage: '看板娘加载失败',
                    reloadMessage: '点击重新加载',
                    restMessage: '看板娘休息中',
                    switchingMessage: '正在切换角色'
                }
            });
        };

        const start = () => {
            initPlayer().catch(error => console.warn('播放器加载失败:', error));
            initLive2d().catch(error => console.warn('看板娘加载失败:', error));
        };

        // 首屏空闲后再加载；切到后台标签页时立即暂停加载（visibilitychange 时取消）
        if ('requestIdleCallback' in window) {
            requestIdleCallback(start, { timeout: 4000 });
        } else {
            window.addEventListener('load', () => setTimeout(start, 1200), { once: true });
        }
    })();
</script>

    <i data-lucide="arrow-up" class="w-5 h-5"></i>
</button>
<script>
    (function () {
        const button = document.getElementById('back-to-top');
        const update = () => button.classList.toggle('is-visible', window.scrollY > 320);
        window.addEventListener('scroll', update, { passive: true });
        update();
        button.addEventListener('click', () => window.scrollTo({
            top: 0,
            behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
        }));
    })();
</script>
