<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="个人起始页：时钟、搜索、天气、网站导航、便签与待办，数据保存在本机浏览器。">
    <meta name="theme-color" content="#0f172a">
    <meta property="og:title" content="起始页 | Start Page">
    <meta property="og:description" content="个人起始页：时钟、搜索、天气、网站导航、便签与待办，数据保存在本机浏览器。">
    <meta property="og:type" content="website">
    <title>起始页 | Start Page</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./img/icon-192.png" />

    <!-- PWA：注册 Service Worker，离线可用（本地开发跳过，避免旧缓存干扰调试） -->
    <script>
        (function () {
            var isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
            if ('serviceWorker' in navigator && !isLocal) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').catch(error => console.warn('SW 注册失败:', error));
                }, { once: true });
            }
        })();
    </script>

    <!-- 预连接常用 CDN 与接口域名，加快首屏资源加载 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://gcore.jsdelivr.net">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://api.open-meteo.com">
    <link rel="dns-prefetch" href="https://picsum.photos">
    <link rel="dns-prefetch" href="https://suggestion.baidu.com">
    <link rel="dns-prefetch" href="https://v1.hitokoto.cn">

    <!-- 字体：拉丁字符使用本地 Inter，中文使用 HarmonyOS Sans SC。 -->
    <style>
        @font-face {
            font-family: 'Inter';
            src: url('./fonts/Inter-latin.woff2') format('woff2');
            font-weight: 300 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'JetBrains Mono';
            src: url('./fonts/JetBrainsMono-latin.woff2') format('woff2');
            font-weight: 300 700;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/harmonyos-sans-sc-webfont-splitted@1.1.0/dist/index.css" />

    <!-- 依赖库 -->
    <!-- Tailwind 已预编译为静态 CSS（由 tailwind.config.js + css/tailwind.src.css 构建） -->
    <link rel="stylesheet" href="./css/tailwind.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"
            onerror="this.onerror=null;this.src='https://unpkg.com/lunar-javascript@1.7.7/lunar.js'"></script>

    <style>
        :lang(zh-CN) {
            font-family: 'Inter', 'HarmonyOS Sans SC', 'Microsoft YaHei UI', 'PingFang SC', system-ui, sans-serif;
        }

        html {
            background-color: #0f172a;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            text-shadow: 0 .05rem .1rem rgba(0, 0, 0, .5);
            isolation: isolate;
        }

        #water-effect {
            position: fixed;
            inset: 0;
            z-index: -20;
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* APlayer 在白色面板和动态壁纸上都保持清晰可读。 */
        .aplayer.aplayer-fixed .aplayer-title {
            color: #111827;
            font-weight: 700;
            text-shadow: none;
        }

        .aplayer.aplayer-fixed .aplayer-info .aplayer-music .aplayer-author {
            color: #475569;
            font-weight: 500;
            text-shadow: none;
        }

        .aplayer.aplayer-fixed .aplayer-list {
            background: rgba(255, 255, 255, 0.98);
            text-shadow: none;
        }

        .aplayer.aplayer-fixed .aplayer-list ol li {
            border-top-color: #e2e8f0;
        }

        .aplayer.aplayer-fixed .aplayer-list ol li:hover {
            background: #f1f5f9;
        }

        .aplayer.aplayer-fixed .aplayer-list ol li.aplayer-list-light {
            background: #e2e8f0;
        }

        .aplayer.aplayer-fixed .aplayer-list .aplayer-list-index {
            color: #64748b;
        }

        .aplayer.aplayer-fixed .aplayer-list .aplayer-list-title {
            color: #0f172a;
            font-weight: 600;
        }

        .aplayer.aplayer-fixed .aplayer-list .aplayer-list-author {
            color: #475569;
            font-weight: 500;
        }

        .aplayer.aplayer-fixed .aplayer-list .aplayer-list-light .aplayer-list-title {
            color: #020617;
            font-weight: 700;
        }

        .aplayer.aplayer-fixed .aplayer-lrc p {
            color: rgba(255, 255, 255, 0.82);
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 8px rgba(0, 0, 0, 0.8);
        }

        .aplayer.aplayer-fixed .aplayer-lrc .aplayer-lrc-current {
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 1px 3px #000000, 0 0 10px rgba(0, 0, 0, 0.9);
        }

        /* 滚动条美化 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
        
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 亚克力玻璃拟态 */
        .acrylic {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .acrylic-hover { transition: all 0.3s ease; }
        .acrylic-hover:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }


        .dynamic-menu-container {
            position: fixed; /* 使用 fixed 定位，避免滚动父级影响 */
            min-width: 220px;
            max-width: 300px; /* 限制最大宽度 */
            padding: 4px;
            border-radius: 0.75rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            /* 关键：限制最大高度，启用内部滚动 */
            max-height: calc(100vh - 20px); 
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* 菜单出现动画 */
        .animate-fade-in {
            animation: menuFadeIn 0.1s ease-out forwards;
        }

        @keyframes menuFadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .wallpaper-status {
            position: fixed;
            top: calc(64px + env(safe-area-inset-top, 0px));
            right: max(20px, env(safe-area-inset-right, 0px));
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 9px;
            width: max-content;
            min-width: 210px;
            max-width: min(320px, calc(100vw - 32px));
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 0.75rem;
            opacity: 0;
            transform: translateY(-6px) scale(0.98);
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
        }

        .wallpaper-status.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .wallpaper-status__icon {
            display: grid;
            place-items: center;
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            color: #14B8A6;
        }

        .wallpaper-status__icon svg {
            width: 16px;
            height: 16px;
        }

        .wallpaper-status__message {
            min-width: 0;
            overflow: hidden;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            text-overflow: ellipsis;
            text-shadow: 0 .05rem .1rem rgba(0, 0, 0, .5);
            white-space: nowrap;
        }

        .wallpaper-status.is-loading .wallpaper-status__icon svg {
            animation: wallpaperStatusSpin 0.9s linear infinite;
        }

        .wallpaper-status.is-success .wallpaper-status__icon { color: #34d399; }

        .wallpaper-status.is-error .wallpaper-status__icon { color: #fb7185; }

        @keyframes wallpaperStatusSpin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1023px) {
            .wallpaper-status {
                top: calc(68px + env(safe-area-inset-top, 0px));
                right: max(16px, env(safe-area-inset-right, 0px));
            }
        }

        @media (max-width: 640px) {
            .wallpaper-status {
                right: max(16px, env(safe-area-inset-right, 0px));
                left: max(16px, env(safe-area-inset-left, 0px));
                width: auto;
                min-width: 0;
                max-width: none;
            }
        }

        @media (max-width: 360px) {
            .wallpaper-status {
                right: max(10px, env(safe-area-inset-right, 0px));
                left: max(10px, env(safe-area-inset-left, 0px));
                gap: 8px;
                padding: 9px 10px;
            }

            .wallpaper-status__message {
                overflow: visible;
                font-size: 12px;
                overflow-wrap: anywhere;
                text-overflow: clip;
                white-space: normal;
            }
        }

        /* 表单控件：允许选中文本，去掉正文的文字阴影 */
        input,
        textarea,
        select,
        [contenteditable="true"] {
            user-select: text;
            -webkit-user-select: text;
            text-shadow: none;
        }

        input::placeholder,
        textarea::placeholder { color: #64748b; }

        ::selection { background: rgba(20, 184, 166, 0.35); }

        /* 起始页：数字时钟等宽数字 */
        .tabular { font-variant-numeric: tabular-nums; }

        /* 网站导航磁贴的首字母占位图标 */
        .tile-letter {
            display: grid;
            place-items: center;
            font-size: 15px;
            font-weight: 700;
            color: #e2e8f0;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.45), rgba(59, 130, 246, 0.45));
        }

        /* 浮层面板（搜索补全 / 弹窗）：会盖在其它卡片上，需要更实的底色保证可读性 */
        .overlay-panel {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 便签输入框 */
        .note-input {
            width: 100%;
            min-height: 74px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: #f1f5f9;
            font: inherit;
            font-size: 13.5px;
            line-height: 1.6;
        }

        /* 卡片入场动画 */
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-enter { animation: cardIn 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both; }

        /* 按压反馈：给可点击元素轻微的物理感 */
        .press { transition: transform 0.12s ease; }
        .press:active { transform: scale(0.96); }

        /* 导航磁贴悬停微抬升 */
        .tile-lift { transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease; }
        .tile-lift:hover { transform: translateY(-3px); }
        .tile-lift:active { transform: translateY(-1px) scale(0.98); }

        /* 触屏设备没有 hover：磁贴的编辑/删除按钮常显，并放大到适合手指的尺寸 */
        @media (hover: none) {
            .tile-actions { display: flex; }
            .tile-actions button { width: 1.75rem; height: 1.75rem; }
        }

        /* 搜索框聚焦光晕 */
        .search-glow { transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.25s ease; }
        .search-glow:focus-within {
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.18), 0 8px 32px rgba(13, 148, 136, 0.12);
        }

        /* 键盘可达性：磁贴与卡片内链接获得清晰的焦点环 */
        .tile-lift:focus-visible,
        a:focus-visible:not([class*="grid"]),
        button:focus-visible:not([class*="place-items"]):not(.press) {
            outline: 2px solid rgba(45, 212, 191, 0.8);
            outline-offset: 2px;
            border-radius: 0.75rem;
        }

        /* 页面首次加载淡入，避免暗色背景突兀闪现 */
        body { animation: bodyIn 0.4s ease-out both; }
        @keyframes bodyIn { from { opacity: 0; } to { opacity: 1; } }

        /* 返回顶部按钮：右下角被 Live2D 看板娘占据（其舞台会拦截点击），
           左下角是 APlayer 迷你播放器，因此放到播放器上方 */
        .back-to-top {
            position: fixed;
            left: max(20px, env(safe-area-inset-left, 0px));
            bottom: max(92px, calc(env(safe-area-inset-bottom, 0px) + 92px));
            z-index: 150;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 9999px;
            color: #e2e8f0;
            cursor: pointer;
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
        }

        .back-to-top.is-visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .back-to-top:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

        @media (prefers-reduced-motion: reduce) {
            .back-to-top { transition: none; }
            body { animation: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .wallpaper-status { transition: none; }
            .wallpaper-status.is-loading .wallpaper-status__icon svg { animation: none; }
            .acrylic-hover { transition: none; }
            .card-enter { animation: none; }
            .press, .press:active { transform: none; transition: none; }
            .tile-lift, .tile-lift:hover, .tile-lift:active { transform: none; transition: none; }
        }

        /* ===================== 新组件补充样式 ===================== */

        /* 静态编译的 Tailwind 里没有 grid-cols-7 与 lg:col-span-12，这里补齐 */
        .sp-grid-7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }

        @media (min-width: 1024px) {
            .sp-lg-col-12 { grid-column: span 12 / span 12; }
        }

        /* 导航独占整行后磁贴需要更密的列数（静态编译产物里没有 lg:grid-cols-6 / xl:grid-cols-8） */
        @media (min-width: 1024px) {
            .sp-lg-grid-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        }

        @media (min-width: 1280px) {
            .sp-xl-grid-8 { grid-template-columns: repeat(8, minmax(0, 1fr)); }
        }

        .leading-relaxed { line-height: 1.625; }

        /* 新 markup 用到、但静态编译时未生成过的少量工具类（与 Tailwind 产物保持一致） */
        .border-amber-300 { border-color: #fcd34d; }
        .mx-1 { margin-left: 0.25rem; margin-right: 0.25rem; }
        .min-h-\[220px\] { min-height: 220px; }
        .min-h-\[22px\] { min-height: 22px; }

        /* 日历单元格 */
        .cal-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            height: 44px;
            border: 1px solid transparent;
            border-radius: 0.75rem;
            transition: background-color 0.15s ease;
            cursor: pointer;
        }

        .cal-cell:hover { background: rgba(255, 255, 255, 0.07); }

        .cal-cell.is-selected { border-color: rgba(20, 184, 166, 0.6); background: rgba(20, 184, 166, 0.12); }

        .cal-cell.is-today .cal-day { color: #5eead4; font-weight: 700; }

        /* 番茄钟表盘 */
        .pomo-ring { width: 11rem; height: 11rem; }

        .pomo-ring-svg { transform: rotate(-90deg); }

        /* 表单原生控件的主题适配 */
        input[type="date"] { color-scheme: dark; }
        input[type="checkbox"] { accent-color: #14B8A6; width: 0.95rem; height: 0.95rem; }

        /* 快捷键帮助面板的按键胶囊 */
        .help-kbd {
            display: inline-grid;
            place-items: center;
            min-width: 1.4rem;
            padding: 0.12rem 0.42rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom-width: 2px;
            border-radius: 0.375rem;
            background: rgba(255, 255, 255, 0.06);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            color: #cbd5e1;
        }
    </style>
</head>

<body x-data="mainApp" class="overflow-x-hidden min-h-screen lg:pt-12 select-none"
      @contextmenu="openContextMenu($event)"
      @click="closeContextMenu()">

    <canvas id="water-effect" aria-hidden="true"></canvas>

    <!-- 背景装饰 -->
    <div class="fixed inset-0 overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-brand-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[10%] right-[-5%] w-[400px] h-[400px] bg-blue-600/20 rounded-full blur-[100px]"></div>
    </div>

    <!-- ===================== 顶部菜单栏 ===================== -->
<header class="hidden lg:flex fixed top-0 left-0 w-full h-12 acrylic z-50 items-center px-4 justify-between shadow-lg">
        <div class="flex items-center h-full">
            <div class="mr-6 font-bold text-white flex items-center gap-2">
                <i data-lucide="layout-grid" class="w-5 h-5 text-brand-500"></i>
                <span>Start Page</span>
            </div>
            
            <!-- 顶部菜单循环 -->
            <div class="flex h-full items-center gap-1">
                <template x-for="(item, index) in menuData" :key="index">
                    <div class="relative h-8 px-3 rounded-md flex items-center cursor-pointer hover:bg-white/10 transition-colors text-sm text-gray-300 hover:text-white group"
                         @mouseenter="handleTopMenuHover($event, item)"
                         @click="handleMenuClick(item, $event)">
                        <!-- 顶级菜单图标 -->
                        <i x-show="item.icon" :data-lucide="item.icon" class="w-3.5 h-3.5 mr-2 opacity-70"></i>
                        <span x-text="item.label"></span>
                        <i x-show="item.children" data-lucide="chevron-down" class="w-3 h-3 ml-1 opacity-50"></i>
                    </div>
                </template>
            </div>
        </div>

        <!-- 右侧状态区 -->
        <div class="flex items-center gap-3 text-xs text-gray-400">
            <span x-show="bookmarkStatus === 'loading'" class="flex items-center">
                <i data-lucide="loader-2" class="w-3 h-3 animate-spin mr-1"></i> 加载中
            </span>
            <span x-show="bookmarkStatus === 'error'" class="text-red-400 flex items-center">
                <i data-lucide="alert-circle" class="w-3 h-3 mr-1"></i> 无书签文件

            <a href="https://github.com/zero-ljz" target="_blank" rel="noopener noreferrer"
               aria-label="访问 GitHub" title="GitHub"
               class="grid w-8 h-8 place-items-center rounded-md text-gray-400 hover:bg-white/10 hover:text-white transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-500">
                <svg aria-hidden="true" viewBox="0 0 24 24" class="w-4 h-4 fill-current">

                </svg>
            </a>
            <a href="mailto:hi@iapp.run" aria-label="发送邮件" title="hi@iapp.run"
               class="grid w-8 h-8 place-items-center rounded-md text-gray-400 hover:bg-white/10 hover:text-white transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-500">
                <i data-lucide="mail" class="w-4 h-4"></i>
            </a>
            <a href="https://iapp.run" target="_blank" rel="noopener noreferrer"
               aria-label="访问 iapp.run" title="iapp.run"
               class="block w-8 h-8 rounded-full bg-gradient-to-tr from-brand-500 to-cyan-500 p-[1px] transition-opacity hover:opacity-80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-500">
                <img src="img/avatar.png" alt="zero-ljz" class="rounded-full w-full h-full bg-black object-cover">
            </a>
        </div>
    </header>

    <!-- 移动端菜单按钮：唤起同一套菜单 -->
    <div class="lg:hidden fixed top-4 right-4 z-50">
        <button @click.stop="openMobileMenu($event)" aria-label="打开菜单"
                class="acrylic p-2 rounded-lg text-white hover:bg-white/10 transition">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- ===================== 起始页主体 ===================== -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 pt-20 lg:pt-8 pb-24 space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-6 lg:grid-cols-12 gap-6">

        <!-- 时钟 + 搜索（z-20 让搜索补全面板能盖住下方卡片：卡片的 backdrop-filter 会形成层叠上下文，
             所以必须提升整张卡片的层级，仅提升面板自身无效；天气组件关闭时独占整行） -->
        <section class="col-span-1 md:col-span-6 lg:col-span-8 flex flex-col acrylic rounded-3xl p-6 sm:p-8 relative z-20 card-enter"
                 :class="widgets.weather ? '' : 'sp-lg-col-12'">
            <!-- 光晕单独裁剪，避免卡片 overflow 影响搜索补全面板 -->
            <div class="absolute inset-0 rounded-3xl overflow-hidden pointer-events-none">
                <div class="absolute -top-24 -right-20 w-72 h-72 bg-brand-600/20 rounded-full blur-3xl"></div>
            </div>
            <div class="relative z-10 flex-1 flex flex-col justify-center space-y-7">
                <div class="flex flex-col sm:flex-row sm:flex-wrap lg:flex-nowrap items-center gap-6 sm:gap-9" x-data="clockWidget">
                    <!-- 模拟表盘 -->
                    <div class="relative w-32 h-32 shrink-0 rounded-full border-4 border-white/10 bg-black/20 backdrop-blur-sm shadow-inner">
                        <template x-for="i in 12" :key="i">
                            <div class="absolute inset-0" :style="`transform: rotate(${i * 30}deg)`">
                                <div class="w-1 h-2 bg-white/30 mx-auto mt-1"></div>
                            </div>
                        </template>
                        <div class="absolute top-1/2 left-1/2 w-1.5 h-8 bg-white rounded-full origin-bottom" :style="`transform: translate(-50%, -100%) rotate(${h}deg)`"></div>
                        <div class="absolute top-1/2 left-1/2 w-1 h-11 bg-gray-300 rounded-full origin-bottom" :style="`transform: translate(-50%, -100%) rotate(${m}deg)`"></div>
                        <div class="absolute top-1/2 left-1/2 w-0.5 h-12 bg-brand-500 rounded-full origin-bottom" :style="`transform: translate(-50%, -100%) rotate(${s}deg)`"></div>
                        <div class="absolute top-1/2 left-1/2 w-3 h-3 bg-brand-500 rounded-full -translate-x-1/2 -translate-y-1/2 shadow-lg border-2 border-white/20"></div>
                    </div>
                    <!-- 数字时间 -->
                    <div class="min-w-0 flex-1 text-center sm:text-left">
                        <p class="flex items-center justify-center sm:justify-start gap-2 text-sm text-gray-400">
                            <i data-lucide="sparkles" class="w-4 h-4 text-brand-500"></i>
                            <span x-text="greeting"></span>
                        </p>
                        <p class="mt-1.5 font-mono font-bold text-white tabular leading-none">
                            <span class="text-5xl sm:text-6xl" x-text="hhmm"></span>
                            <span class="text-2xl sm:text-3xl text-brand-300/90 ml-1" x-text="ss"></span>
                        </p>
                        <p class="mt-3 text-sm text-gray-300" x-text="dateString"></p>
                        <p x-show="widgets.quote && quote" class="mt-2 text-xs text-gray-400 italic max-w-lg" x-text="quote"></p>
                    </div>
                    <!-- 农历新年倒数 -->
                    <div x-show="widgets.newYear && ready" x-data="lunarNewYearCountdown" style="display: none"
                         class="w-full sm:basis-full lg:basis-auto lg:w-auto lg:min-w-[190px] shrink-0 pt-5 lg:pt-0 lg:pl-8 border-t lg:border-t-0 lg:border-l border-white/10 text-center lg:text-left">
                        <p class="flex items-center justify-center lg:justify-start gap-2 text-xs text-gray-400">
                            <i data-lucide="calendar-days" class="w-4 h-4 text-brand-500" aria-hidden="true"></i>
                            <span>距离农历新年</span>
                        </p>
                        <p class="mt-2 font-mono font-bold tabular leading-none text-white">
                            <span class="text-4xl text-brand-300" x-text="days"></span>
                            <span class="ml-1 text-sm font-sans text-gray-300">天</span>
                        </p>
                        <p class="mt-2 text-[11px] text-gray-500" x-text="targetLabel"></p>
                    </div>
                </div>

                <!-- 搜索 -->
                <div x-data="searchWidget" class="relative">
                    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar sm:flex-wrap">
                        <template x-for="engine in $store.search.engines" :key="engine.id">
                            <button type="button" @click="setEngine(engine.id)"
                                    :class="isActive(engine.id) ? 'bg-white/15 border-white/25 text-white' : 'bg-white/5 border-white/10 text-gray-300 hover:bg-white/10'"
                                    class="press shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-medium transition">
                                <img :src="favicon(engine.host)" alt="" class="w-3.5 h-3.5 rounded-sm" onerror="this.style.visibility='hidden'">
                                <span x-text="engine.name"></span>
                            </button>
                        </template>
                        <button type="button" @click="$store.search.openManager()" title="管理搜索引擎"
                                class="press shrink-0 w-8 h-8 grid place-items-center rounded-xl border border-dashed border-white/15 text-gray-400 hover:text-white hover:border-white/30 transition">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    <form @submit.prevent="submit()" class="mt-3 relative" autocomplete="off">
                        <div class="search-glow flex items-center gap-3 h-14 px-5 rounded-2xl bg-white/5 border border-white/10 focus-within:border-brand-500/60 focus-within:bg-white/10">
                            <i data-lucide="search" class="w-5 h-5 shrink-0 text-brand-300"></i>
                            <input id="sp-search" x-ref="input" type="text" x-model="query"
                                   @input.debounce.200ms="loadSuggestions()"
                                   @keydown="onKeydown($event)"
                                   placeholder="搜索，或输入网址直达…"
                                   class="flex-1 min-w-0 bg-transparent border-0 outline-none text-base text-white">
                            <span x-show="looksLikeUrl" style="display: none"
                                  class="hidden sm:block shrink-0 px-2 py-1 rounded-lg border border-brand-500/30 bg-brand-500/20 text-[11px] text-brand-200">回车直达</span>
                            <button type="button" x-show="query" style="display: none" @click="reset()" aria-label="清空"
                                    class="shrink-0 text-gray-500 hover:text-white transition">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                            <kbd class="hidden sm:block shrink-0 px-1.5 py-0.5 rounded border border-white/10 font-mono text-[10px] text-gray-500">/</kbd>
                        </div>
                        <div x-show="activeItems.length > 0 || (panelOpen && suggestions.length)" @click.outside="panelOpen = false" style="display: none"
                             class="absolute left-0 right-0 top-[calc(100%+8px)] z-50 overlay-panel rounded-2xl p-2 max-h-72 overflow-y-auto custom-scrollbar shadow-2xl shadow-black/40">
                            <template x-for="(item, index) in activeItems" :key="mode + ':' + (item.url || item.label || item)">
                                <button type="button" @click="pick(item)" @mouseenter="activeIndex = index"
                                        :class="activeIndex === index ? 'bg-white/10 text-white' : 'text-gray-300'"
                                        class="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-left text-sm transition">
                                    <img x-show="mode === 'files'" :src="favicon(item.url)" alt="" class="w-4 h-4 rounded-sm shrink-0" onerror="this.style.visibility='hidden'">
                                    <i x-show="mode === 'search'" data-lucide="search" class="w-3.5 h-3.5 shrink-0 opacity-50"></i>
                                    <i x-show="mode === 'commands'" :data-lucide="item.icon || 'command'" class="w-3.5 h-3.5 shrink-0 opacity-60"></i>
                                    <span class="flex-1 min-w-0 truncate" x-text="itemLabel(item)"></span>
                                    <span x-show="mode === 'files'" style="display: none" class="shrink-0 text-[10px] text-gray-500" x-text="item.source"></span>
                                    <kbd x-show="mode === 'commands' && item.shortcut" style="display: none"
                                         class="shrink-0 px-1.5 py-0.5 rounded border border-white/10 font-mono text-[10px] text-gray-500" x-text="item.shortcut"></kbd>
                                </button>
                            </template>
                            <div class="flex items-center justify-between px-3 pt-1.5 pb-0.5 text-[10px] text-gray-500 select-none">
                                <span x-text="panelHint"></span>
                                <span x-show="mode === 'search'" style="display: none" x-text="Alpine.store('search').engineId.toUpperCase()"></span>
                            </div>
                        </div>
                    </form>

                    <!-- 搜索引擎管理：新增 / 编辑 / 删除，列表存本机 -->
                    <template x-teleport="body">
                        <div x-show="$store.search.managerOpen" style="display: none" @click.self="$store.search.closeManager()"
                             @keydown.escape.window="$store.search.closeManager()"
                             class="fixed inset-0 z-[10050] grid place-items-center bg-black/70 backdrop-blur-sm p-4">
                            <div class="overlay-panel rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl shadow-black/50">
                                <div class="flex items-center justify-between">
                                    <h4 class="font-semibold text-white">管理搜索引擎</h4>
                                    <button @click="$store.search.closeManager()" class="text-gray-400 hover:text-white transition">
                                        <i data-lucide="x" class="w-5 h-5"></i>
                                    </button>
                                </div>

                                <!-- 现有引擎 -->
                                <div class="space-y-1.5 max-h-72 overflow-y-auto custom-scrollbar pr-1">
                                    <template x-for="engine in $store.search.engines" :key="engine.id">
                                        <div class="flex items-center gap-3 px-3 py-2 rounded-xl bg-white/5 border border-white/5">
                                            <img :src="favicon(engine.host)" alt="" class="w-4 h-4 rounded-sm shrink-0" onerror="this.style.visibility='hidden'">
                                            <div class="flex-1 min-w-0">
                                                <p class="text-sm text-gray-200 truncate" x-text="engine.name"></p>
                                                <p class="text-[11px] text-gray-500 truncate font-mono" x-text="engine.url"></p>
                                            </div>
                                            <button @click="$store.search.openManager(engine)" title="编辑"
                                                    class="w-7 h-7 grid place-items-center rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition">
                                                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                                            </button>
                                            <button @click="$store.search.removeEngine(engine.id)" title="删除"
                                                    class="w-7 h-7 grid place-items-center rounded-lg text-gray-400 hover:text-rose-400 hover:bg-white/10 transition">
                                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>
                                    </template>
                                </div>

                                <!-- 新增 / 编辑表单 -->
                                <div class="space-y-3">
                                    <p class="text-xs text-gray-400" x-text="$store.search.draft.id ? '编辑引擎' : '添加引擎'"></p>
                                    <label class="block space-y-1.5">
                                        <span class="text-xs text-gray-400">名称</span>
                                        <input type="text" x-model="$store.search.draft.name" placeholder="例如 掘金"
                                               class="w-full h-11 px-3 rounded-xl bg-white/5 border border-white/10 text-sm text-white outline-none focus:border-brand-500/60">
                                    </label>
                                    <label class="block space-y-1.5">
                                        <span class="text-xs text-gray-400">搜索链接</span>
                                        <input type="text" x-model="$store.search.draft.url" @keydown.enter.prevent="$store.search.saveEngine()"
                                               placeholder="https://juejin.cn/search?query=%s"
                                               class="w-full h-11 px-3 rounded-xl bg-white/5 border border-white/10 text-sm text-white outline-none focus:border-brand-500/60">
                                    </label>
                                    <p class="text-[11px] text-gray-500 leading-relaxed">%s 代表关键词插入位置；没有 %s 时链接需以 = 结尾，关键词会追加在末尾。</p>
                                    <p x-show="$store.search.managerError" style="display: none" class="text-xs text-rose-400" x-text="$store.search.managerError"></p>
                                </div>

                                <div class="flex justify-end gap-2">
                                    <button @click="$store.search.closeManager()" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm hover:bg-white/10 transition">关闭</button>
                                    <button @click="$store.search.saveEngine()" x-text="$store.search.draft.id ? '保存' : '添加'"
                                            class="press px-4 py-2 rounded-xl bg-white text-black text-sm font-semibold hover:bg-gray-200 transition"></button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </section>

            <!-- ============ 天气 ============ -->
            <section x-show="widgets.weather" x-data="weatherWidget" style="display: none; animation-delay: 0.08s"
                     class="col-span-1 md:col-span-6 lg:col-span-4 acrylic rounded-3xl p-6 flex flex-col card-enter">
                <div class="flex items-center justify-between gap-2 mb-4">
                    <div class="flex items-center gap-2 min-w-0">
                        <i data-lucide="cloud-sun" class="w-5 h-5 shrink-0 text-sky-400"></i>
                        <h3 class="text-lg font-semibold text-white shrink-0">天气</h3>
                        <span class="text-xs text-gray-400 truncate" x-text="place.name"></span>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button @click="editing = !editing" title="切换城市"
                                class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition">
                            <i data-lucide="map-pin" class="w-4 h-4"></i>
                        </button>
                        <button @click="load()" title="刷新"
                                class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition">
                            <i data-lucide="refresh-ccw" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- 城市切换 -->
                <div x-show="editing" style="display: none" class="mb-4 space-y-2">
                    <div class="flex gap-2">
                        <input type="text" x-model="cityQuery" @keydown.enter.prevent="searchCity()" placeholder="城市名，如 长沙 / Tokyo"
                               class="flex-1 min-w-0 h-10 px-3 rounded-xl bg-white/5 border border-white/10 text-sm text-white outline-none focus:border-brand-500/60">
                        <button @click="searchCity()" class="h-10 px-3 rounded-xl bg-white/10 border border-white/10 text-sm hover:bg-white/20 transition">搜索</button>
                        <button @click="useGeolocation()" title="使用当前定位"
                                class="h-10 w-10 grid place-items-center rounded-xl bg-white/10 border border-white/10 hover:bg-white/20 transition">
                            <i data-lucide="locate-fixed" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <template x-for="city in cityResults" :key="city.id">
                        <button @click="pickCity(city)"
                                class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-left text-sm transition">
                            <span class="truncate" x-text="city.label"></span>
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5 shrink-0 opacity-50"></i>
                        </button>
                    </template>
                </div>

                <div x-show="loading" style="display: none" class="flex-1 grid place-items-center py-10">
                    <div class="animate-spin rounded-full h-7 w-7 border-b-2 border-sky-400"></div>
                </div>
                <p x-show="error" style="display: none" class="flex-1 grid place-items-center py-10 text-center text-sm text-gray-400" x-text="error"></p>

                <div x-show="!loading && !error" style="display: none" class="flex-1 flex flex-col justify-between gap-5">
                    <div class="flex items-center gap-4">
                        <span class="w-16 h-16 shrink-0 grid place-items-center rounded-2xl bg-white/5 border border-white/10 text-sky-300"
                              x-html="`<i data-lucide='${current.icon}' class='w-9 h-9'></i>`"></span>
                        <div class="min-w-0">
                            <p class="font-mono font-bold text-white tabular leading-none">
                                <span class="text-4xl" x-text="current.temp"></span><span class="text-xl align-top">°C</span>
                            </p>
                            <p class="mt-1.5 text-sm text-gray-300 truncate" x-text="current.label"></p>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <template x-for="stat in stats" :key="stat.label">
                            <div class="px-2 py-2.5 rounded-xl bg-white/5 border border-white/5 text-center">
                                <p class="text-[11px] text-gray-400" x-text="stat.label"></p>
                                <p class="mt-0.5 text-sm font-semibold text-white font-mono tabular" x-text="stat.value"></p>
                            </div>
                        </template>
                    </div>

                    <div class="grid grid-cols-4 gap-2">
                        <template x-for="day in daily" :key="day.date">
                            <div class="px-1 py-3 rounded-xl bg-white/5 border border-white/5 flex flex-col items-center gap-1.5">
                                <p class="text-[11px] text-gray-400" x-text="day.weekday"></p>
                                <span class="text-sky-300" x-html="`<i data-lucide='${day.icon}' class='w-5 h-5'></i>`"></span>
                                <p class="text-[11px] font-mono tabular text-gray-300">
                                    <span class="text-white font-semibold" x-text="day.max"></span>
                                    <span class="opacity-60" x-text="'/' + day.min"></span>
                                </p>
                            </div>
                        </template>
                    </div>
                </div>
            </section>

            <!-- ============ 网站导航 ============ -->
            <section x-show="widgets.nav" x-data="navWidget" style="display: none; animation-delay: 0.16s"
                     class="col-span-1 md:col-span-6 sp-lg-col-12 acrylic rounded-3xl p-6 flex flex-col card-enter">
                <div class="flex items-center justify-between gap-2 mb-4">
                    <div class="flex items-center gap-2 min-w-0">
                        <i data-lucide="compass" class="w-5 h-5 shrink-0 text-brand-500"></i>
                        <h3 class="text-lg font-semibold text-white shrink-0">网站导航</h3>
                        <span class="text-xs text-gray-400 bg-white/10 px-2 py-0.5 rounded-full shrink-0" x-text="`${total} 个`"></span>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button @click="importBookmarks()" title="从 bookmarks.json 导入"
                                class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition">
                            <i data-lucide="bookmark" class="w-4 h-4"></i>
                        </button>
                        <button @click.stop="openAdd()" title="添加网站"
                                class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- 分组标签 -->
                <div class="flex items-center gap-1.5 mb-4 overflow-x-auto no-scrollbar">
                    <template x-for="(group, index) in groups" :key="group.name + index">
                        <button @click="activeGroup = index"
                                :class="activeGroup === index ? 'bg-white/15 border-white/25 text-white' : 'bg-white/5 border-white/10 text-gray-400 hover:bg-white/10 hover:text-white'"
                                class="press shrink-0 px-3 py-1.5 rounded-xl border text-xs font-medium transition">
                            <span x-text="group.name"></span>
                            <span class="opacity-50" x-text="`(${group.items.length})`"></span>
                        </button>
                    </template>
                    <template x-if="!addingGroup">
                        <button @click.stop="startAddGroup()" title="新建分组"
                                class="shrink-0 w-8 h-8 grid place-items-center rounded-xl border border-dashed border-white/15 text-gray-400 hover:text-white hover:border-white/30 transition">
                            <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
                        </button>
                    </template>
                    <template x-if="addingGroup">
                        <input x-ref="groupInput" type="text" x-model="groupDraft" placeholder="分组名，回车确认"
                               @keydown.enter.prevent="addGroup()" @keydown.escape="addingGroup = false" @blur="addGroup()"
                               class="shrink-0 h-8 w-36 px-2.5 rounded-xl bg-white/5 border border-white/15 text-xs text-white outline-none focus:border-brand-500/60">
                    </template>
                    <button x-show="groups.length > 1" style="display: none" @click="removeGroup()" title="删除当前分组"
                            class="shrink-0 w-8 h-8 grid place-items-center rounded-xl text-gray-500 hover:text-rose-400 hover:bg-white/5 transition">
                        <i data-lucide="folder-minus" class="w-3.5 h-3.5"></i>
                    </button>
                </div>

                <!-- 磁贴 -->
                <div class="grid grid-cols-3 sm:grid-cols-4 sp-lg-grid-6 sp-xl-grid-8 gap-3">
                    <template x-for="(site, index) in items" :key="site.id">
                        <div class="relative group">
                            <a :href="site.url" target="_blank" rel="noopener noreferrer" :title="site.url"
                               class="tile-lift flex flex-col items-center gap-2 px-2 py-3.5 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/20">
                                <span class="relative w-9 h-9 shrink-0 rounded-xl overflow-hidden">
                                    <span class="tile-letter absolute inset-0" x-text="initial(site.name)"></span>
                                    <img :src="favicon(site.url)" alt="" loading="lazy" style="opacity: 0; transition: opacity .2s"
                                         class="absolute inset-0 w-full h-full object-cover"
                                         onload="this.style.opacity=1" onerror="this.remove()">
                                </span>
                                <span class="w-full text-center text-xs text-gray-300 truncate" x-text="site.name"></span>
                            </a>
                            <div class="tile-actions absolute top-1 right-1 hidden group-hover:flex items-center gap-0.5">
                                <button @click.prevent.stop="openEdit(index)" title="编辑"
                                        class="w-6 h-6 grid place-items-center rounded-lg bg-black/40 text-gray-300 hover:text-white transition">
                                    <i data-lucide="pencil" class="w-3 h-3"></i>
                                </button>
                                <button @click.prevent.stop="remove(index)" title="删除"
                                        class="w-6 h-6 grid place-items-center rounded-lg bg-black/40 text-gray-300 hover:text-rose-400 transition">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                            </div>
                        </div>
                    </template>
                    <button @click.stop="openAdd()"
                            class="tile-lift min-h-[92px] flex flex-col items-center justify-center gap-2 rounded-2xl border border-dashed border-white/15 text-gray-400 hover:text-white hover:border-white/30 hover:bg-white/5">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                        <span class="text-xs">添加</span>
                    </button>
                </div>
                <p x-show="!items.length" style="display: none" class="mt-4 text-center text-xs text-gray-500">该分组还没有网站，点“添加”创建一个吧。</p>

                <!-- 添加 / 编辑网站：传送到 body，避免被卡片的 backdrop-filter 限制成局部定位 -->
                <template x-teleport="body">
                    <div x-show="modalOpen" style="display: none" @click.self="modalOpen = false"
                         @keydown.escape.window="modalOpen = false"
                         class="fixed inset-0 z-[10050] grid place-items-center bg-black/70 backdrop-blur-sm p-4">
                        <div class="overlay-panel rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl shadow-black/50">
                            <div class="flex items-center justify-between">
                                <h4 class="font-semibold text-white" x-text="editIndex === null ? '添加网站' : '编辑网站'"></h4>
                                <button @click="modalOpen = false" class="text-gray-400 hover:text-white transition">
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>
                            </div>
                            <label class="block space-y-1.5">
                                <span class="text-xs text-gray-400">名称</span>
                                <input type="text" x-model="form.name" placeholder="例如 GitHub"
                                       class="w-full h-11 px-3 rounded-xl bg-white/5 border border-white/10 text-sm text-white outline-none focus:border-brand-500/60">
                            </label>
                            <label class="block space-y-1.5">
                                <span class="text-xs text-gray-400">网址</span>
                                <input type="text" x-model="form.url" @keydown.enter.prevent="save()" placeholder="github.com"
                                       class="w-full h-11 px-3 rounded-xl bg-white/5 border border-white/10 text-sm text-white outline-none focus:border-brand-500/60">
                            </label>
                            <label class="block space-y-1.5">
                                <span class="text-xs text-gray-400">分组</span>
                                <select x-model.number="form.group"
                                        class="w-full h-11 px-3 rounded-xl bg-slate-800 border border-white/10 text-sm text-white outline-none focus:border-brand-500/60">
                                    <template x-for="(group, index) in groups" :key="group.name + index">
                                        <option :value="index" x-text="group.name"></option>
                                    </template>
                                </select>
                            </label>
                            <p x-show="formError" style="display: none" class="text-xs text-rose-400" x-text="formError"></p>
                            <div class="flex justify-end gap-2 pt-1">
                                <button @click="modalOpen = false" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm hover:bg-white/10 transition">取消</button>
                                <button @click="save()" class="press px-4 py-2 rounded-xl bg-white text-black text-sm font-semibold hover:bg-gray-200 transition">保存</button>
                            </div>
                        </div>
                    </div>
                </template>
            </section>

            <!-- ============ 便签 ============ -->
            <section x-show="widgets.notes" x-data="notesWidget" style="display: none"
                     class="col-span-1 md:col-span-3 lg:col-span-6 acrylic rounded-3xl p-6 flex flex-col h-[430px] card-enter" style="animation-delay: 0.24s">
                <div class="flex items-center justify-between gap-2 mb-4 shrink-0">
                    <div class="flex items-center gap-2">
                        <i data-lucide="sticky-note" class="w-5 h-5 shrink-0 text-amber-300"></i>
                        <h3 class="text-lg font-semibold text-white">便签</h3>
                        <span class="text-xs text-gray-400 bg-white/10 px-2 py-0.5 rounded-full" x-text="`${notes.length} 张`"></span>
                    </div>
                    <button @click="add()" title="新建便签"
                            class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-3">
                    <template x-for="(note, index) in notes" :key="note.id">
                        <div class="rounded-2xl border p-3" :style="`background:${colorOf(note).bg};border-color:${colorOf(note).border}`">
                            <textarea class="note-input custom-scrollbar" rows="3" placeholder="写点什么…"
                                      x-model="note.text" @input.debounce.400ms="touch(note)"></textarea>
                            <div class="flex items-center justify-between gap-2 mt-2 pt-2 border-t border-white/10">
                                <span class="text-[10px] text-gray-400 font-mono shrink-0" x-text="timeLabel(note)"></span>
                                <div class="flex items-center gap-1.5">
                                    <template x-for="color in colors" :key="color.id">
                                        <button @click="setColor(note, color.id)" :title="color.id"
                                                :class="note.color === color.id ? 'ring-2 ring-white/70' : 'opacity-60 hover:opacity-100'"
                                                class="w-3.5 h-3.5 rounded-full transition" :style="`background:${color.dot}`"></button>
                                    </template>
                                    <button @click="remove(index)" title="删除便签"
                                            class="ml-1 p-1 rounded-md text-gray-400 hover:text-rose-400 hover:bg-white/10 transition">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                    <p x-show="!notes.length" style="display: none" class="h-full grid place-items-center text-center text-xs text-gray-500">
                        还没有便签，点右上角 + 新建一张。
                    </p>
                </div>
            </section>

            <!-- ============ 待办 ============ -->
            <section x-show="widgets.todo" x-data="todoWidget" style="display: none"
                     class="col-span-1 md:col-span-3 lg:col-span-6 acrylic rounded-3xl p-6 flex flex-col h-[430px] card-enter" style="animation-delay: 0.32s">
                <div class="flex items-center justify-between gap-2 mb-4 shrink-0">
                    <div class="flex items-center gap-2">
                        <i data-lucide="list-todo" class="w-5 h-5 shrink-0 text-emerald-400"></i>
                        <h3 class="text-lg font-semibold text-white">待办</h3>
                        <span class="text-xs text-gray-400 bg-white/10 px-2 py-0.5 rounded-full" x-text="`${remaining} 项未完成`"></span>
                    </div>
                    <button x-show="todos.some(t => t.done)" style="display: none" @click="clearDone()" title="清除已完成"
                            class="p-2 rounded-lg text-gray-400 hover:text-rose-400 hover:bg-white/10 transition">
                        <i data-lucide="eraser" class="w-4 h-4"></i>
                    </button>
                </div>

                <form @submit.prevent="add()" class="flex gap-2 mb-3 shrink-0">
                    <input type="text" x-model="draft" placeholder="添加一项待办，回车保存"
                           class="flex-1 min-w-0 h-11 px-3.5 rounded-xl bg-white/5 border border-white/10 text-sm text-white outline-none focus:border-brand-500/60 focus:bg-white/10 transition">
                    <button type="submit" class="press w-11 h-11 shrink-0 grid place-items-center rounded-xl bg-white/10 border border-white/10 text-white hover:bg-white/20 transition">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </form>

                <div class="flex items-center gap-1.5 mb-3 shrink-0">
                    <template x-for="tab in filters" :key="tab.id">
                        <button @click="filter = tab.id"
                                :class="filter === tab.id ? 'bg-white/15 border-white/25 text-white' : 'bg-white/5 border-white/10 text-gray-400 hover:bg-white/10 hover:text-white'"
                                class="press px-3 py-1 rounded-lg border text-[11px] font-medium transition" x-text="tab.label"></button>
                    </template>
                </div>

                <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-1.5">
                    <template x-for="todo in visible" :key="todo.id">
                        <div class="group flex items-start gap-3 px-2.5 py-2.5 rounded-xl hover:bg-white/5 border border-transparent hover:border-white/5 transition">
                            <button @click="toggle(todo)" :aria-pressed="todo.done"
                                    :class="todo.done ? 'bg-emerald-500 border-emerald-500' : 'border-gray-500 hover:border-emerald-400'"
                                    class="mt-0.5 w-4 h-4 shrink-0 rounded border grid place-items-center transition-colors">
                                <svg x-show="todo.done" style="display: none" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3 text-white">
                                    <path d="M20 6 9 17l-5-5"></path>
                                </svg>
                            </button>
                            <template x-if="editingId !== todo.id">
                                <span class="flex-1 min-w-0 text-sm break-words cursor-text"
                                      :class="todo.done ? 'text-gray-500 line-through' : 'text-gray-200'"
                                      @dblclick="startEdit(todo)" x-text="todo.text"></span>
                            </template>
                            <template x-if="editingId === todo.id">
                                <input type="text" x-model="editDraft" x-init="$el.focus()" @keydown.enter.prevent="commitEdit(todo)"
                                       @keydown.escape="editingId = null" @blur="commitEdit(todo)"
                                       class="flex-1 min-w-0 h-7 px-2 rounded-lg bg-white/10 border border-white/15 text-sm text-white outline-none">
                            </template>
                            <span class="hidden sm:block shrink-0 mt-0.5 text-[10px] text-gray-500 font-mono" x-text="dateLabel(todo)"></span>
                            <button @click="remove(todo.id)" title="删除"
                                    class="hidden group-hover:block shrink-0 p-0.5 text-gray-500 hover:text-rose-400 transition">
                                <i data-lucide="x" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </template>
                    <p x-show="!visible.length" style="display: none" class="h-full grid place-items-center text-center text-xs text-gray-500">
                        这里空空如也，享受当下 ✨
                    </p>
                </div>
            </section>

            <!-- ============ 日历 ============ -->
            <section x-show="widgets.calendar" x-data="calendarWidget"
                     style="display: none; animation-delay: 0.4s"
                     class="col-span-1 md:col-span-3 lg:col-span-4 acrylic rounded-3xl p-6 flex flex-col card-enter">
                <div class="flex items-center justify-between gap-2 mb-3 shrink-0">
                    <div class="flex items-center gap-2 min-w-0">
                        <i data-lucide="calendar" class="w-5 h-5 shrink-0 text-sky-400"></i>
                        <h3 class="text-lg font-semibold text-white shrink-0" x-text="monthLabel"></h3>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button @click="prev()" title="上个月"
                                class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition">
                            <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        </button>
                        <button @click="goToday()" title="回到今天"
                                class="px-2 py-1 rounded-lg text-xs text-gray-400 hover:text-white hover:bg-white/10 transition">今天</button>
                        <button @click="next()" title="下个月"
                                class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition">
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div class="sp-grid-7 gap-1 mb-1 text-center text-[11px] text-gray-500 select-none">
                    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="text-rose-400">六</span><span class="text-rose-400">日</span>
                </div>

                <div class="sp-grid-7 gap-1">
                    <template x-for="week in weeks" :key="week[0].key">
                        <template x-for="cell in week" :key="cell.key">
                            <button type="button" @click="selected = cell.key" :title="cell.title"
                                    :class="[cell.key === selected ? 'is-selected' : '', cell.key === todayStr ? 'is-today' : '']"
                                    class="cal-cell" :style="cell.inMonth ? '' : 'opacity:.4'">
                                <span class="cal-day text-sm leading-none text-gray-300" x-text="cell.day"></span>
                                <span class="text-[10px] leading-none" :class="cell.highlight ? 'text-brand-300' : 'text-gray-500'" x-text="cell.lunar"></span>
                            </button>
                        </template>
                    </template>
                </div>

                <div class="mt-3 pt-3 border-t border-white/10 shrink-0 space-y-1.5">
                    <p class="text-sm text-gray-300 truncate">
                        <span class="font-semibold text-white" x-text="selectedInfo.label"></span>
                        <span class="mx-1 text-gray-500">·</span>
                        <span x-text="selectedInfo.lunar"></span>
                    </p>
                    <p class="flex items-center flex-wrap gap-1.5 min-h-[22px]">
                        <template x-for="tag in selectedInfo.tags" :key="tag">
                            <span class="px-2 py-0.5 rounded-full bg-brand-500/20 border border-brand-500/30 text-[11px] text-brand-200" x-text="tag"></span>
                        </template>
                        <span x-show="!selectedInfo.tags.length" style="display: none" class="text-xs text-gray-500">无节气或节日</span>
                    </p>
                </div>
            </section>

            <!-- ============ 番茄钟 ============ -->
            <section x-show="widgets.pomodoro" x-data="pomodoroWidget"
                     style="display: none; animation-delay: 0.48s"
                     class="col-span-1 md:col-span-3 lg:col-span-4 acrylic rounded-3xl p-6 flex flex-col card-enter">
                <div class="flex items-center justify-between gap-2 mb-3 shrink-0">
                    <div class="flex items-center gap-2 min-w-0">
                        <i data-lucide="timer" class="w-5 h-5 shrink-0 text-rose-400"></i>
                        <h3 class="text-lg font-semibold text-white shrink-0">番茄钟</h3>
                        <span class="text-xs text-gray-400 bg-white/10 px-2 py-0.5 rounded-full shrink-0" x-text="count + ' 🍅'"></span>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <template x-for="len in focusOptions" :key="len">
                            <button @click="setFocusLen(len)"
                                    :class="focusLen === len ? 'bg-white/15 border-white/25 text-white' : 'bg-white/5 border-white/10 text-gray-400 hover:bg-white/10 hover:text-white'"
                                    class="press px-2 py-1 rounded-lg border font-mono tabular text-[11px] transition" x-text="len + '′'"></button>
                        </template>
                    </div>
                </div>

                <div class="flex-1 grid place-items-center min-h-[220px]">
                    <div class="relative grid place-items-center pomo-ring">
                        <svg viewBox="0 0 120 120" class="pomo-ring-svg w-full h-full" aria-hidden="true">
                            <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"></circle>
                            <circle cx="60" cy="60" r="54" fill="none" stroke-linecap="round"
                                    :stroke="mode === 'focus' ? '#14B8A6' : '#38bdf8'"
                                    :stroke-dasharray="RING" :stroke-dashoffset="RING * (1 - progress)"></circle>
                        </svg>
                        <div class="absolute inset-0 grid place-items-center text-center">
                            <div>
                                <p class="font-mono font-bold text-white tabular leading-none text-4xl" x-text="display"></p>
                                <p class="mt-2 text-xs" :class="mode === 'focus' ? 'text-brand-300' : 'text-sky-400'" x-text="modeLabel"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-center gap-2 mt-4 shrink-0">
                    <button @click="toggle()" class="press px-5 py-2 rounded-xl bg-white text-black text-sm font-semibold hover:bg-gray-200 transition"
                            x-text="running ? '暂停' : (remain < total ? '继续' : '开始')"></button>
                    <button @click="reset()" title="重置当前阶段"
                            class="press px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-gray-300 hover:bg-white/10 hover:text-white transition">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                    <button @click="skip()" title="跳到下一阶段"
                            class="press px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-gray-300 hover:bg-white/10 hover:text-white transition">
                        <i data-lucide="skip-forward" class="w-4 h-4"></i>
                    </button>
                </div>
                <p class="mt-3 text-center text-xs text-gray-500" x-text="'今日专注 ' + focusMin + ' 分钟 · 每满 4 个番茄休息 15 分钟'"></p>
            </section>

            <!-- ============ 纪念日倒数 ============ -->
            <section x-show="widgets.anniversaries" x-data="anniversaryWidget"
                     style="display: none; animation-delay: 0.56s"
                     class="col-span-1 md:col-span-6 lg:col-span-4 acrylic rounded-3xl p-6 flex flex-col h-[430px] card-enter">
                <div class="flex items-center justify-between gap-2 mb-3 shrink-0">
                    <div class="flex items-center gap-2 min-w-0">
                        <i data-lucide="heart" class="w-5 h-5 shrink-0 text-rose-400"></i>
                        <h3 class="text-lg font-semibold text-white shrink-0">纪念日</h3>
                        <span class="text-xs text-gray-400 bg-white/10 px-2 py-0.5 rounded-full shrink-0" x-text="items.length + ' 个'"></span>
                    </div>
                    <button @click="adding = !adding" title="添加纪念日"
                            class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition">
                        <i :data-lucide="adding ? 'x' : 'plus'" class="w-4 h-4"></i>
                    </button>
                </div>

                <form x-show="adding" style="display: none" @submit.prevent="add()" class="mb-3 space-y-2 shrink-0">
                    <div class="flex gap-2">
                        <input type="text" x-model="name" placeholder="名称，如 生日"
                               class="flex-1 min-w-0 h-10 px-3 rounded-xl bg-white/5 border border-white/10 text-sm text-white outline-none focus:border-brand-500/60">
                        <input type="date" x-model="date"
                               class="h-10 px-2.5 rounded-xl bg-white/5 border border-white/10 text-sm text-white outline-none focus:border-brand-500/60">
                    </div>
                    <div class="flex items-center justify-between gap-2">
                        <label class="flex items-center gap-1.5 text-xs text-gray-400 cursor-pointer">
                            <input type="checkbox" x-model="annual"> 每年重复
                        </label>
                        <button type="submit" class="press h-8 px-3 rounded-xl bg-white text-black text-xs font-semibold hover:bg-gray-200 transition">保存</button>
                    </div>
                </form>

                <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-1.5">
                    <template x-for="item in sorted" :key="item.id">
                        <div class="group flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 transition">
                            <div class="min-w-0">
                                <p class="text-sm text-gray-200 truncate" x-text="item.name"></p>
                                <p class="mt-0.5 text-[11px] text-gray-500" x-text="item.sub"></p>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <div class="text-right">
                                    <p x-show="!item.isToday" class="font-mono font-bold tabular leading-none text-white">
                                        <span class="text-2xl" x-text="item.days"></span>
                                        <span class="ml-0.5 text-xs font-sans text-gray-400" x-text="item.unit"></span>
                                    </p>
                                    <p x-show="item.isToday" style="display: none" class="font-bold text-brand-300 text-sm leading-none">今天 🎉</p>
                                </div>
                                <button @click="remove(item.id)" title="删除"
                                        class="hidden group-hover:block p-1 rounded-md text-gray-500 hover:text-rose-400 transition">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                    </template>
                    <p x-show="!sorted.length" style="display: none" class="h-full grid place-items-center text-center text-xs text-gray-500">
                        还没有纪念日，点右上角 + 添加。
                    </p>
                </div>
            </section>

            <!-- ============ 每日资讯 ============ -->
            <section x-show="widgets.news" x-data="newsWidget"
                     style="display: none; animation-delay: 0.64s"
                     class="col-span-1 md:col-span-6 sp-lg-col-12 acrylic rounded-3xl p-6 flex flex-col h-[430px] card-enter">
                <div class="flex items-center justify-between gap-2 mb-3 shrink-0">
                    <div class="flex items-center gap-2 min-w-0">
                        <i data-lucide="newspaper" class="w-5 h-5 shrink-0 text-amber-300"></i>
                        <h3 class="text-lg font-semibold text-white shrink-0">每日资讯</h3>
                        <span class="text-xs text-gray-400 truncate" x-text="metaLabel"></span>
                    </div>
                    <button @click="load(true)" title="刷新"
                            class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition shrink-0">
                        <i data-lucide="refresh-ccw" class="w-4 h-4"></i>
                    </button>
                </div>

                <div x-show="loading" style="display: none" class="flex-1 grid place-items-center py-10">
                    <div class="animate-spin rounded-full h-7 w-7 border-b-2 border-amber-300"></div>
                </div>
                <p x-show="error" style="display: none" class="flex-1 grid place-items-center py-10 text-center text-sm text-gray-400" x-text="error"></p>

                <div x-show="!loading && !error" style="display: none" class="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-1">
                    <template x-for="(item, index) in items" :key="index">
                        <div class="flex items-start gap-3 px-2 py-1.5 rounded-xl hover:bg-white/5 transition">
                            <span class="shrink-0 mt-0.5 w-5 h-5 grid place-items-center rounded-md bg-white/10 text-[10px] font-mono text-brand-300 tabular" x-text="index + 1"></span>
                            <span class="min-w-0 text-sm text-gray-300 leading-relaxed break-words" x-text="item"></span>
                        </div>
                    </template>
                </div>
                <p x-show="tip && !loading && !error" style="display: none"
                   class="mt-3 pt-3 border-t border-white/10 shrink-0 text-xs text-gray-400 italic truncate" x-text="'『' + tip + '』'"></p>
            </section>

        </div>

        <!-- 快捷键帮助 -->
        <template x-teleport="body">
            <div x-show="helpOpen" style="display: none" @click.self="helpOpen = false"
                 @keydown.escape.window="helpOpen = false"
                 class="fixed inset-0 z-[10050] grid place-items-center bg-black/70 backdrop-blur-sm p-4">
                <div class="overlay-panel rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl shadow-black/50">
                    <div class="flex items-center justify-between">
                        <h4 class="font-semibold text-white flex items-center gap-2">
                            <i data-lucide="keyboard" class="w-5 h-5 text-brand-500"></i> 快捷键
                        </h4>
                        <button @click="helpOpen = false" class="text-gray-400 hover:text-white transition">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

    <!-- 逻辑脚本 -->
    <script>
        // ===================== 起始页：通用工具 =====================
        const LS_PREFIX = 'startpage.v1.';

        const LS = {
            get(key, fallback) {
                try {
                    const raw = localStorage.getItem(LS_PREFIX + key);
                    return raw === null ? JSON.parse(JSON.stringify(fallback)) : JSON.parse(raw);
                } catch (error) {
                    return JSON.parse(JSON.stringify(fallback));
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
                } catch (error) {
                    console.warn('本地存储不可用:', error);
                }
            },
            keys() {
                try {
                    return Object.keys(localStorage).filter(key => key.startsWith(LS_PREFIX));
                } catch (error) {
                    return [];
                }
            },
            clearAll() {
                this.keys().forEach(key => localStorage.removeItem(key));
            }
        };

        const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
        const pad2 = value => String(value).padStart(2, '0');
        const refreshIcons = () => { try { lucide.createIcons(); } catch (error) { /* lucide 未就绪 */ } };

        // 本地日期键：YYYY-MM-DD，番茄钟 / 资讯缓存 / 纪念日共用
        const todayKey = () => {
            const now = new Date();
            return `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
        };

        // 子序列模糊匹配：返回得分，0 表示不匹配；空关键词一律返回 1
        const fuzzyMatch = (text, term) => {
            if (!term) return 1;
            const target = String(text || '').toLowerCase();
            const pattern = term.toLowerCase();
            let hit = 0, score = 0, last = -2;
            for (let i = 0; i < target.length && hit < pattern.length; i++) {
                if (target[i] === pattern[hit]) {
                    score += i === last + 1 ? 3 : 1;
                    last = i;
                    hit++;
                }
            }
            return hit === pattern.length ? score : 0;
        };

        const footerYear = document.getElementById('footer-year');
        if (footerYear) footerYear.textContent = new Date().getFullYear();

        const normalizeUrl = value => {
            const raw = (value || '').trim();
            if (!raw) return '';
            if (/^[a-z][a-z0-9+.-]*:/i.test(raw)) return raw;
            return `https://${raw}`;
        };

        const hostOf = url => {
            try { return new URL(normalizeUrl(url)).hostname; } catch (error) { return ''; }
        };

        // 与书签菜单共用同一个 Favicon 服务
        const faviconOf = target => {
            const host = target.includes('.') && !target.includes('/') ? target : hostOf(target);
            return host ? `https://p.252525.xyz/https://www.google.com/s2/favicons?domain=${host}&sz=64` : '';

        // ===================== 起始页：静态配置 =====================
        const SEARCH_ENGINES = [

        const loadEngines = () => {

            engine.url.includes('%s') ? engine.url.replace('%s', encodeURIComponent(keyword)) : engine.url + encodeURIComponent(keyword);

            const entry = WEATHER_CODES[code] || { label: '未知', icon: 'cloud' };
            return { label: entry.label, icon: (!isDay && entry.night) ? entry.night : entry.icon };
